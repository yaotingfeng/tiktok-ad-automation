# 仅安装为独立 tt-ada.conf，不覆盖原站点。修改后 nginx -t 通过才可 reload。
server {
    listen 8000 ssl;
    server_name manjuad.gzjunbo.net;

    ssl_certificate /etc/nginx/ssl/gzjunbo.net/gzjunbo.net.pem;
    ssl_certificate_key /etc/nginx/ssl/gzjunbo.net/gzjunbo.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 浏览器加密 API 需要 HTTPS；兼容用户输入的同端口 HTTP 地址。
    error_page 497 =308 https://manjuad.gzjunbo.net:8000$request_uri;
    access_log off;
    error_log /var/log/nginx/tt-ada-error.log crit;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
