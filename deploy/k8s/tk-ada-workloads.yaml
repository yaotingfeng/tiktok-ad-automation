apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-worker-ads-backfill
  labels:
    app: tiktok-ad-automation
    role: worker-ads-backfill
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: worker-ads-backfill
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: worker-ads-backfill
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: tiktok-ad-automation
              matchExpressions:
              - key: role
                operator: In
                values:
                - worker-ads-backfill
                - worker-ads-reporting
            topologyKey: kubernetes.io/hostname
      containers:
        - name: worker-ads-backfill
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "2", memory: 16Gi}
            limits: {cpu: "6", memory: 16Gi}
          # 后台32槽与持久化background池32/12配套；调整须先排空且确认旧Pod退出。
          # 子进程超过500MiB后完成当前任务再回收；16Gi申请保留父进程和任务峰值余量，并限制在可容纳的大节点。
          command: [celery, -A, "app.jobs.celery_app:celery_app", worker, -Q, "ads-backfill,ads-directory", --pool, prefork, --concurrency, "32", --max-memory-per-child, "512000", --loglevel=INFO, --hostname, "ads-backfill@%h"]
          readinessProbe:
            exec:
              command: [python, -c, "import socket; from app.jobs.celery_app import celery_app; r=celery_app.control.ping(destination=['ads-backfill@'+socket.gethostname()], timeout=5); raise SystemExit(0 if r else 1)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            # 每个 prefork 子进程最多 3 个数据库连接，避免共享 PG 超额。
            - name: DATABASE_POOL_SIZE
              value: "2"
            - name: DATABASE_MAX_OVERFLOW
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-worker-ads-live-directory
  labels:
    app: tiktok-ad-automation
    role: worker-ads-live-directory
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: worker-ads-live-directory
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: worker-ads-live-directory
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker-ads-live-directory
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "4", memory: 6Gi}
          # 实时消费者不抓取后台全量/历史依赖；本地发布由独立 ads-publish 池执行。
          # 远端I/O占主导，24槽预留4Gi申请/6Gi上限；连接池仍为每进程2+1。
          command: [celery, -A, "app.jobs.celery_app:celery_app", worker, -Q, ads-live-directory, --pool, prefork, --concurrency, "24", --loglevel=INFO, --hostname, "ads-live-directory@%h"]
          readinessProbe:
            exec:
              command: [python, -c, "import socket; from app.jobs.celery_app import celery_app; r=celery_app.control.ping(destination=['ads-live-directory@'+socket.gethostname()], timeout=5); raise SystemExit(0 if r else 1)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            # 每个 prefork 子进程最多 3 个数据库连接，避免共享 PG 超额。
            - name: DATABASE_POOL_SIZE
              value: "2"
            - name: DATABASE_MAX_OVERFLOW
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
