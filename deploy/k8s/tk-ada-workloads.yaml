    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      # 大目录本地发布至多600秒，覆盖Celery690秒硬限及正常退出余量。
      terminationGracePeriodSeconds: 750
      containers:
        - name: worker-ads-directory
