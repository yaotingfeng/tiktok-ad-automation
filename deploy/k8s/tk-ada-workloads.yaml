apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-worker-control
  labels:
    app: tiktok-ad-automation
    role: worker-control
spec:
  replicas: 1
  # 控制进程先正常退出再启动新实例，避免滚动期间加倍连接及内存峰值。
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: worker-control
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: worker-control
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker-control
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "250m", memory: 2Gi}
            limits: {cpu: "1", memory: 4Gi}
          # 三个控制子进程实测单进程峰值约1Gi；原2Gi容器会被OOM终止。
          # 预留瞬时峰值，超额子进程在完成当前任务后回收，保留租约和正常退出。
          # 不增加执行槽或数据库连接；任务数上限也限制长期保留的Python堆。
          command: [celery, -A, "app.jobs.celery_app:celery_app", worker, -Q, control, --pool, prefork, --concurrency, "3", --max-memory-per-child, "384000", --max-tasks-per-child, "100", --loglevel=INFO, --hostname, "control@%h"]
          readinessProbe:
            exec:
              command: [python, -c, "import socket; from app.jobs.celery_app import celery_app; r=celery_app.control.ping(destination=['control@'+socket.gethostname()], timeout=5); raise SystemExit(0 if r else 1)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            # 每个 prefork 子进程最多 3 个数据库连接，避免共享 PG 超额。
            - name: DATABASE_POOL_SIZE
              value: "2"
            - name: DATABASE_MAX_OVERFLOW
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
---
