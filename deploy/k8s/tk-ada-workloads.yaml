apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-beat
  labels:
    app: tiktok-ad-automation
    role: beat
spec:
  replicas: 1
  # 更新时先停止旧调度器，避免重复投递及共享 schedule 文件冲突。
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: beat
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: beat
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: beat
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "250m", memory: 512Mi}
            limits: {cpu: "500m", memory: 1Gi}
          command: [celery, -A, "app.jobs.celery_app:celery_app", beat, --schedule, /var/run/celery/celerybeat-schedule, --loglevel=INFO]
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: beat-data
              mountPath: /var/run/celery
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
      volumes:
        - name: beat-data
          persistentVolumeClaim:
            claimName: tiktok-ad-automation-beat
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
