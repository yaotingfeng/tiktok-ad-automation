apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-worker-ads-reporting
  labels:
    app: tiktok-ad-automation
    role: worker-ads-reporting
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: worker-ads-reporting
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: worker-ads-reporting
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      # Beat 盘与备份盘固定在 ap-southeast-1b，且该区只有一台节点；发布辅助 Pod 必须挂这两块盘。
      # 报表 Worker 申请 2 CPU，落到该节点会挤占辅助 Pod 而使发布在停服后失败，故排除该区。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                - ap-southeast-1b
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: tiktok-ad-automation
              matchExpressions:
              - key: role
                operator: In
                values:
                - worker-ads-backfill
                - worker-ads-reporting
            topologyKey: kubernetes.io/hostname
      containers:
        - name: worker-ads-reporting
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "6", memory: 10Gi}
          command: [celery, -A, "app.jobs.celery_app:celery_app", worker, -Q, ads-reporting, --pool, prefork, --concurrency, "24", --loglevel=INFO, --hostname, "ads-reporting@%h"]
          readinessProbe:
            exec:
              command: [python, -c, "import socket; from app.jobs.celery_app import celery_app; r=celery_app.control.ping(destination=['ads-reporting@'+socket.gethostname()], timeout=5); raise SystemExit(0 if r else 1)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            # 每个 prefork 子进程最多 3 个数据库连接，避免共享 PG 超额。
            - name: DATABASE_POOL_SIZE
              value: "2"
            - name: DATABASE_MAX_OVERFLOW
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
