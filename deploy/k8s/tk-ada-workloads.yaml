apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-api
  labels:
    app: tiktok-ad-automation
    role: api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: api
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: api
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          command: [uvicorn, "app.main:app", --host, "0.0.0.0", --port, "80", --workers, "1", --no-access-log, --proxy-headers, --forwarded-allow-ips, "*"]
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/utils/health-check/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/utils/health-check/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-worker-resource
  labels:
    app: tiktok-ad-automation
    role: worker-resource
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: worker-resource
  template:
    metadata:
      annotations:
        tk-ada/config-digest: "__CONFIG_DIGEST__"
      labels:
        app: tiktok-ad-automation
        role: worker-resource
    spec:
      imagePullSecrets:
        - name: tiktok-ad-automation-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 960
      containers:
        - name: worker-resource
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: "1500m", memory: 4Gi}
            limits: {cpu: "4", memory: 8Gi}
          command: [celery, -A, "app.jobs.celery_app:celery_app", worker, -Q, "resources,resource-results", --pool, prefork, --concurrency, "8", --loglevel=INFO, --hostname, "resources@%h"]
          readinessProbe:
            exec:
              command: [python, -c, "import socket; from app.jobs.celery_app import celery_app; r=celery_app.control.ping(destination=['resources@'+socket.gethostname()], timeout=5); raise SystemExit(0 if r else 1)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            # 每个 prefork 子进程最多 3 个数据库连接，避免共享 PG 超额。
            - name: DATABASE_POOL_SIZE
              value: "2"
            - name: DATABASE_MAX_OVERFLOW
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada/mcp-client.json
              subPath: mcp-client.json
              readOnly: true
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
