apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-api
  labels:
    app: tiktok-ad-automation
    role: api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: api
  template:
    metadata:
      labels:
        app: tiktok-ad-automation
        role: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [uvicorn, "app.main:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --no-access-log, --proxy-headers, --forwarded-allow-ips, "*"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/utils/health-check/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/utils/health-check/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-ad-automation-worker-resource
  labels:
    app: tiktok-ad-automation
    role: worker-resource
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: tiktok-ad-automation
      role: worker-resource
  template:
    metadata:
      labels:
        app: tiktok-ad-automation
        role: worker-resource
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 960
      containers:
        - name: worker-resource
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [celery, -A, "app.jobs.celery_app:celery_app", worker, -Q, "resources,resource-results", --pool, prefork, --concurrency, "2", --loglevel=INFO, --hostname, "resources@%h"]
          envFrom:
            - configMapRef:
                name: tiktok-ad-automation-defaults
            - secretRef:
                name: tiktok-ad-automation-runtime
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_CLIENT_REGISTRATION_REF
              value: /run/tk-ada/mcp-client.json
          volumeMounts:
            - name: mcp-registration
              mountPath: /run/tk-ada
              readOnly: true
      volumes:
        - name: mcp-registration
          secret:
            secretName: tiktok-ad-automation-mcp-registration
