apiVersion: v1
kind: ConfigMap
metadata:
  name: tiktok-ad-automation-defaults
  labels:
    app: tiktok-ad-automation
data:
  PROJECT_NAME: TK-ADA
  OBJECT_STORAGE_PROVIDER: r2
  S3_REGION: auto
  MATERIAL_STORAGE_GLOBAL_BYTES: "0"
  MATERIAL_STORAGE_TENANT_BYTES: "0"
  MCP_CLIENT_REGISTRATION_REF: /run/tk-ada/mcp-client.json
---
apiVersion: v1
kind: Service
metadata:
  name: tiktok-ad-automation
  labels:
    app: tiktok-ad-automation
spec:
  selector:
    app: tiktok-ad-automation
    role: api
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiktok-ad-automation-beat
  labels:
    app: tiktok-ad-automation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
