apiVersion: v1
kind: ConfigMap
metadata:
  name: tiktok-ad-automation-defaults
  labels:
    app: tiktok-ad-automation
data:
  PROJECT_NAME: TK-ADA
  OBJECT_STORAGE_PROVIDER: r2
  S3_REGION: auto
  MATERIAL_STORAGE_GLOBAL_BYTES: "0"
  MATERIAL_STORAGE_TENANT_BYTES: "0"
  MCP_CLIENT_REGISTRATION_REF: /run/tk-ada/mcp-client.json
---
apiVersion: v1
kind: Service
metadata:
  name: tiktok-ad-automation
  labels:
    app: tiktok-ad-automation
spec:
  selector:
    app: tiktok-ad-automation
    role: api
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiktok-ad-automation-beat
  labels:
    app: tiktok-ad-automation
spec:
  # ACK 按首个消费者所在可用区创建云盘，避免多可用区提前绑定错区。
  storageClassName: alicloud-disk-topology-alltype
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiktok-ad-automation-backup
  labels:
    app: tiktok-ad-automation
spec:
  # 发布备份盘：只保留最近一份已恢复验证的完整备份（/backup/latest），只由发布辅助 Pod 挂载。
  # 与 Beat 盘同存储类；首次挂载时与 Beat 盘同在辅助 Pod 上，因此建在同一可用区。
  # 2026-10-16 数据库 5.66 GB、压缩备份约 0.8 GB；发布前检查余量不足会提示在此扩容（支持在线扩容）。
  # 2026-10-26 数据库约 56 GB、完整备份约 18.9 GiB，50Gi 余量不足致每日备份连续失败，按用户确认扩到 100Gi。
  storageClassName: alicloud-disk-topology-alltype
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
