name: Platform CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: backend (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: modules
            pytest-args: --ignore=tests/acceptance
          - suite: acceptance
            pytest-args: tests/acceptance -k 'not lost_reply'
          - suite: campaign-recovery
            pytest-args: tests/acceptance -k 'lost_reply and campaign'
          - suite: other-recovery
            pytest-args: tests/acceptance -k 'lost_reply and not campaign'
          - suite: browser
            pytest-args: ''
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tiktok_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-password
        ports: ['5432:5432']
        options: >-
          --shm-size=256m
          --health-cmd="pg_isready -U postgres -d tiktok_ci_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      PROJECT_NAME: TikTok Ad Automation CI
      DATABASE_URL: postgresql://postgres:ci-local-password@127.0.0.1:5432/tiktok_ci_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      FIRST_SUPERUSER: admin
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      FASTAPI_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.14'}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Isolate unused Chrome APT repository
        run: sudo bash scripts/ci-isolate-chrome-apt-source.sh /etc/apt/sources.list.d "$RUNNER_TEMP/tiktok-ci-disabled-apt-sources"
      - name: Install PostgreSQL 18 backup clients
        if: matrix.suite == 'modules'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          test -x /usr/lib/postgresql/18/bin/pg_dump
          test -x /usr/lib/postgresql/18/bin/pg_restore
          echo "PG_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: uv sync --frozen --package app
      - name: Install media validation tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version
      - name: Check backup client and server versions before the module suite
        if: matrix.suite == 'modules'
        run: uv run python -m tests.pg_backup
        working-directory: backend
      - name: Size the disposable PostgreSQL lock pool for scale tests
        if: matrix.suite == 'modules'
        run: |
          docker exec "${{ job.services.postgres.id }}" sh -c "echo 'max_locks_per_transaction = 1024' >> \"\$PGDATA/postgresql.conf\""
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -h 127.0.0.1 -U postgres -d tiktok_ci_test; then break; fi
            sleep 1
          done
          test "$(docker exec "${{ job.services.postgres.id }}" psql -U postgres -d tiktok_ci_test -Atc 'SHOW max_locks_per_transaction')" = 1024
      - run: uv run ruff check app tests && uv run ty check app
        if: matrix.suite == 'modules'
        working-directory: backend
      - run: uv run pytest -q --tb=short --show-capture=no -m "not mcp" ${{ matrix.pytest-args }}
        if: matrix.suite != 'browser' && matrix.suite != 'modules'
        working-directory: backend
      - name: Run all module tests in isolated groups
        if: matrix.suite == 'modules'
        run: uv run python ../deploy/ci/backend_tests.py --shards 4 --work "$RUNNER_TEMP/backend-modules" --save-durations "$RUNNER_TEMP/backend-modules/durations.json" -- --ignore=tests/acceptance
        working-directory: backend
      - name: Retain module failure details and timings
        if: always() && matrix.suite == 'modules'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-modules
          path: ${{ runner.temp }}/backend-modules
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.suite == 'browser'
        with: {bun-version: '1.4.2'}
      - run: bun install --frozen-lockfile && bun run --filter frontend build
        if: matrix.suite == 'browser'
        env:
          VITE_API_URL: ''
      - run: bun x playwright install --with-deps chromium
        if: matrix.suite == 'browser'
        working-directory: frontend
      - run: bun x playwright test --config=playwright.acceptance.config.ts
        if: matrix.suite == 'browser'
        working-directory: frontend
      - name: Verify R2 browser ingestion through the real API
        run: bun x playwright test --config=playwright.r2-acceptance.config.ts
        if: matrix.suite == 'browser'
        working-directory: frontend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Isolate unused Chrome APT repository
        run: sudo bash scripts/ci-isolate-chrome-apt-source.sh /etc/apt/sources.list.d "$RUNNER_TEMP/tiktok-ci-disabled-apt-sources"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.4.2'}
      - run: bun install --frozen-lockfile
      - run: bun run --filter frontend build
      - run: bun x playwright install --with-deps chromium
        working-directory: frontend
      - run: bun x playwright test --project=workspace --project=workspace-source
        working-directory: frontend
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -f backend/Dockerfile -t tiktok-ad-automation:ci .
