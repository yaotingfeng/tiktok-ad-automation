name: Platform CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: backend (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: modules
            pytest-args: --ignore=tests/acceptance
          - suite: acceptance
            pytest-args: tests/acceptance -k 'not lost_reply'
          - suite: campaign-recovery
            pytest-args: tests/acceptance -k 'lost_reply and campaign'
          - suite: other-recovery
            pytest-args: tests/acceptance -k 'lost_reply and not campaign'
          - suite: browser
            pytest-args: ''
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tiktok_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d tiktok_ci_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      PROJECT_NAME: TikTok Ad Automation CI
      DATABASE_URL: postgresql://postgres:ci-local-password@127.0.0.1:5432/tiktok_ci_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      FIRST_SUPERUSER: admin
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      FASTAPI_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.14'}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Isolate unused Chrome APT repository
        if: matrix.suite == 'modules' || matrix.suite == 'browser'
        run: sudo bash scripts/ci-isolate-chrome-apt-source.sh /etc/apt/sources.list.d "$RUNNER_TEMP/tiktok-ci-disabled-apt-sources"
      - name: Install PostgreSQL 18 backup clients
        if: matrix.suite == 'modules'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          test -x /usr/lib/postgresql/18/bin/pg_dump
          test -x /usr/lib/postgresql/18/bin/pg_restore
          echo "PG_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: uv sync --frozen --package app
      - name: Install media validation tools
        if: matrix.suite != 'browser'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version
      - name: Check backup client and server versions before the module suite
        if: matrix.suite == 'modules'
        run: uv run python -m tests.pg_backup
        working-directory: backend
      - run: uv run ruff check app tests && uv run ty check app
        if: matrix.suite == 'modules'
        working-directory: backend
      - run: uv run pytest -q --tb=short --show-capture=no ${{ matrix.pytest-args }}
        if: matrix.suite != 'browser'
        working-directory: backend
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.suite == 'browser'
        with: {bun-version: '1.4.2'}
      - run: bun install --frozen-lockfile && bun run --filter frontend build
        if: matrix.suite == 'browser'
        env:
          VITE_API_URL: ''
      - run: bun x playwright install --with-deps chromium
        if: matrix.suite == 'browser'
        working-directory: frontend
      - run: bun x playwright test --config=playwright.acceptance.config.ts
        if: matrix.suite == 'browser'
        working-directory: frontend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Isolate unused Chrome APT repository
        run: sudo bash scripts/ci-isolate-chrome-apt-source.sh /etc/apt/sources.list.d "$RUNNER_TEMP/tiktok-ci-disabled-apt-sources"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.4.2'}
      - run: bun install --frozen-lockfile
      - run: bun run --filter frontend build
      - run: bun x playwright install --with-deps chromium
        working-directory: frontend
      - run: bun x playwright test --project workspace
        working-directory: frontend
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -f backend/Dockerfile -t tiktok-ad-automation:ci .
