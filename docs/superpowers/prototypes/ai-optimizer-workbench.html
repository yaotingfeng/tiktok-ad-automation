<script>
(() => {
  const root = document.getElementById('tkada-ai-optimizer');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = v => JSON.parse(JSON.stringify(v));
  const icon = n => '<i data-lucide="' + n + '" aria-hidden="true"></i>';
  const button = (label, action, primary = false, attrs = '') => '<button type="button" class="tk-button cursor-interaction' + (primary ? ' primary' : '') + '" data-action="' + action + '" ' + attrs + '>' + label + '</button>';
  const pill = (label, cls = '') => '<span class="tk-pill ' + cls + '">' + esc(label) + '</span>';
  const money = n => '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:0});
  const prefs = {balanced:'平衡消耗与回收',spend:'优先消耗',roas:'优先 ROAS'};
  const field = (label, key, value, type = 'text', extra = '') => '<label class="tk-field"><span>' + label + '</span><input class="tk-input" data-field="' + key + '" type="' + type + '" value="' + esc(value) + '" ' + extra + '></label>';
  const choose = (label, key, value, choices) => '<label class="tk-field"><span>' + label + '</span><select class="tk-select" data-field="' + key + '">' + choices.map(v => '<option ' + (v === value ? 'selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>';
  const heading = (title, subtitle, actions = '') => '<div class="tk-heading"><div><h1>' + esc(title) + '</h1><p class="tk-sub">' + subtitle + '</p></div><div class="tk-actions">' + actions + '</div></div>';
  const ruleSummary = r => '消耗 > ' + r.cost + ' 且 ROAS < ' + r.roas;
  const emptyRow = () => ({id:'row-' + (++seq),time:'',title:'',provider:'',url:'',dramaId:'',attribution:'',order:false});
  let seq = Date.now();
  function makeTenant(id, name) {
    const strategies = [
      {id:id+'s1',name:'测新标准结构',version:1,groups:2,ads:5,budget:100,bid:1.10},
      {id:id+'s2',name:'稳投回收结构',version:1,groups:1,ads:4,budget:60,bid:1.35}
    ];
    const rules = [
      {id:id+'r1',name:'起量账户控损',version:1,cost:30,roas:.7,action:'暂停系列',frequency:'每 30 分钟',mode:'自动执行',owner:id+'o1'},

  function executeSchedule(o) {
    const rows=o.plans.filter(r=>r.date===state.date);
    if(!o.active){flash('优化师已暂停，未触发搭建。',true);return;}
    if(!rows.length){flash('请先保存当天排期。',true);return;}
    let created=0,blocked=0,skipped=0;
    rows.forEach(r=>{
      if(r.built){skipped++;return;}
      if(r.order&&!tenant().library[r.title]){r.status='等待订单成片';blocked++;return;}
      const count=tenant().library[r.title]||0;
      if(!count){r.status='素材未匹配';blocked++;return;}
      const s=strategy(o);
      r.built=true;r.status='搭建已回读';
      o.builds.push({id:'build-'+(++seq),kind:'build',rowId:r.id,time:state.date.slice(5)+' '+(r.time||o.buildAt),title:r.title,strategyId:s.id,strategyVersion:s.version,optimizerVersion:o.version,accounts:[...o.accounts],matched:count,status:'回读完成'});
      created++;
    });
    state.grid=null;state.gridKey='';
    flash('原型演示：'+created+' 条调用广告搭建并完成回读，'+blocked+' 条等待订单或匹配素材，'+skipped+' 条已执行未重复创建。');
  }

  function createReview(o) {
    if(o.proposals.length&&!o.proposals.some(p=>p.status==='stale')){flash('本示例窗口已有复盘结果，不重复生成；可查看待确认或历史处理。');return;}const stale=o.proposals.filter(p=>p.status==='stale');
    const s=strategy(o),r=rules(o)[0];
    if(!r){flash('请先绑定自动规则。',true);return;}
    const proposals=[
      {id:'proposal-'+(++seq),kind:'rule',entityId:r.id,name:r.name,field:'cost',before:r.cost,after:Math.max(5,Math.round(r.cost*.8)),baseVersion:r.version,status:'pending',reason:'示例：低回收系列在阈值附近继续消耗，建议降低控损触发消耗，下一完整日窗口验证。'},
      {id:'proposal-'+(++seq),kind:'strategy',entityId:s.id,name:s.name,field:'groups',before:s.groups,after:s.groups===1?2:1,baseVersion:s.version,status:'pending',reason:'示例：对比不同广告组结构，建议调整组数作为待验证假设，保留观察窗口。'}
    ].filter(p=>!stale.length||stale.some(old=>old.entityId===p.entityId));
    stale.forEach(p=>p.status='superseded');
    o.proposals.push(...proposals);
    if(o.reviewMode==='auto'){proposals.forEach(p=>applyProposal(o,p,'auto'));const accepted=proposals.filter(p=>p.status==='accepted').length;const waiting=proposals.filter(p=>p.status==='pending').length;flash('示例复盘完成：实际发布 '+accepted+' 项，'+waiting+' 项因共享配置等原因待人工处理。已发布项同步到原策略或规则记录。',waiting>0);}
    else flash('示例复盘完成：所有策略和规则调整均待人工确认。可逐条采纳或不采纳，当前配置未变。');
  }
  function applyProposal(o,p,actor) {
    if(p.status!=='pending')return;
    const entity=(p.kind==='strategy'?tenant().strategies:tenant().rules).find(x=>x.id===p.entityId);
    if(!entity||entity.version!==p.baseVersion){p.status='stale';p.decision='版本已变化，需重新复盘';return;}
    const users=tenant().optimizers.filter(x=>p.kind==='strategy'?x.strategyId===entity.id:x.ruleIds.includes(entity.id));
    if(users.length>1){flash('该配置被多位优化师共用，需先在原模块另存专用配置再采纳，避免影响其他优化师。',true);return;}
    entity[p.field]=p.after;entity.version++;o.version++;p.status='accepted';p.actor=actor;p.publishedVersion=entity.version;
  }

  root.addEventListener('paste',e=>{

    if(a==='edit'){beginConfig(false);return;}
    if(a==='cancel-config'){go('optimizers');return;}
    if(a==='config-tab')state.tab=el.dataset.tab;
    if(a==='next-config')state.tab=state.tab==='goals'?'bindings':'optimization';
    if(a==='dismiss')state.notice='';
    if(a==='toggle-active'){o.active=!o.active;flash(o.active?'该优化师已恢复（原型演示）。':'该优化师已暂停，其他优化师不受影响。');}
    if(a==='manage-strategy'){openModule('strategies');return;}
    if(a==='manage-rules'){openModule('rules');return;}
    if(a==='return-module'){const ctx=state.returnContext;state.returnContext=null;state.edit=null;state.view=ctx?ctx.view:'optimizers';if(ctx&&ctx.tab)state.tab=ctx.tab;state.notice='';}
    if(a==='save-config'){
      const d=state.draft;
      if(!d.name.trim()||!(d.dailySpend>0)||!(d.roas>0)||!d.accounts.length||!tenant().strategies.some(s=>s.id===d.strategyId)){flash('请填写名称、有效目标，分配账户并选择搭建策略。',true);render();return;}
      if(d.isNew){d.id='opt-'+(++seq);delete d.isNew;tenant().optimizers.push(d);}else{d.version++;tenant().optimizers[tenant().optimizers.findIndex(x=>x.id===d.id)]=d;}
      state.selected=d.id;state.draft=null;state.view='overview';flash('已保存优化师及绑定关系；AI 规则优化方式为“'+(d.reviewMode==='manual'?'人工确认':'自动优化')+'”。');
    }
    if(a==='edit-strategy')state.edit={...clone(tenant().strategies.find(x=>x.id===el.dataset.id)),kind:'strategy'};
    if(a==='new-strategy')state.edit={id:'new',kind:'strategy',isNew:true,name:'新搭建策略',version:1,groups:1,ads:5,budget:100,bid:1.1};
    if(a==='edit-rule')state.edit={...clone(tenant().rules.find(x=>x.id===el.dataset.id)),kind:'rule'};
    if(a==='new-rule')state.edit={id:'new',kind:'rule',isNew:true,name:'新自动规则',version:1,cost:20,roas:.8,action:'暂停系列',frequency:'每 30 分钟',mode:'自动执行'};
    if(a==='cancel-entity')state.edit=null;
    if(a==='save-entity'){
      const entity=state.edit;
      if(!entity||!entity.name.trim()||(entity.kind==='strategy'&&(!(entity.groups>=1)||!(entity.ads>=1)||!(entity.budget>0)||!(entity.bid>=1)))||(entity.kind==='rule'&&(!(entity.cost>=0)||!(entity.roas>=0)))){flash('请填写有效配置。',true);render();return;}
      const collection=entity.kind==='strategy'?tenant().strategies:tenant().rules,copy=clone(entity);
      delete copy.kind;delete copy.isNew;
      if(entity.isNew){copy.id='entity-'+(++seq);collection.push(copy);}else{copy.version++;collection[collection.findIndex(x=>x.id===copy.id)]=copy;}
      state.edit=null;flash('已保存到原'+(entity.kind==='strategy'?'投放策略':'自动规则')+'记录；绑定该记录的优化师同步读取。');
    }
    if(a==='grid-undo'&&state.history.length)state.grid=state.history.pop();
    if(a==='grid-clear'){rememberGrid();state.grid=state.grid.filter(r=>r.built).map(clone);while(state.grid.length<10)state.grid.push(emptyRow());}
    if(a==='save-grid'){
      const filled=state.grid.filter(r=>r.title.trim()||r.provider.trim()||r.url.trim()||r.dramaId.trim()||r.time.trim()||r.order);
      const seen=new Set();
      for(const r of filled){if(!r.title.trim()){flash('存在已填内容但缺少剧名的行。',true);render();return;}if(seen.has(r.title.trim())){flash('当天剧名重复，请核对排期。',true);render();return;}seen.add(r.title.trim());if(r.time&&!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(r.time)){flash('执行时间请填写 HH:mm。',true);render();return;}}
      o.plans=[...o.plans.filter(r=>r.date!==state.date),...filled.map(r=>({...clone(r),date:state.date,confirmed:true,status:r.built?r.status:r.order?'待素材订单':'已排期'}))];
      state.grid=null;state.gridKey='';flash('排期已保存。到点后才调用广告搭建匹配素材，账户继承优化师分配范围。');
    }
    if(a==='execute-schedule')executeSchedule(o);
    if(a==='execution-detail')state.executionRecord=o.builds.find(b=>b.id===el.dataset.id);
    if(a==='close-detail')state.executionRecord=null;
    if(a==='run-review')createReview(o);
    if(a==='accept-proposal'){const p=o.proposals.find(p=>p.id===el.dataset.id);if(p){applyProposal(o,p,'human');if(p.status==='accepted')flash('已采纳并发布这项变更；优化师的确认模式未改变。');}}
    if(a==='reject-proposal'){const p=o.proposals.find(p=>p.id===el.dataset.id);if(p&&p.status==='pending'){p.status='rejected';p.actor='human';flash('已记录不采纳；当前配置和版本保持不变。');}}
    if(a==='daily')state.view='daily';
    if(a==='back-review')state.view='review';
    if(a==='build-tasks')state.view='build-tasks';
    render();persist();
  });
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);render();}});
  render();
})();

</script>
