#tkada-ai-optimizer .tk-ai-footer{padding:24px 0 0;margin-top:auto;display:block}

#tkada-ai-optimizer .tk-config-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

</style>
<script>


(() => {
  const root = document.getElementById('tkada-ai-optimizer');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = v => JSON.parse(JSON.stringify(v));
  const icon = n => '<i data-lucide="' + n + '" aria-hidden="true"></i>';
  const button = (label, action, primary = false, attrs = '') => '<button type="button" class="tk-button cursor-interaction' + (primary ? ' primary' : '') + '" data-action="' + action + '" ' + attrs + '>' + label + '</button>';
  const pill = (label, cls = '') => '<span class="tk-pill ' + cls + '">' + esc(label) + '</span>';
  const money = n => '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:0});
  const prefs = {balanced:'平衡消耗与回收',spend:'优先消耗',roas:'优先 ROAS'};
  const field = (label, key, value, type = 'text', extra = '') => '<label class="tk-field"><span>' + label + '</span><input class="tk-input" data-field="' + key + '" type="' + type + '" value="' + esc(value) + '" ' + extra + '></label>';
  const choose = (label, key, value, choices) => '<label class="tk-field"><span>' + label + '</span><select class="tk-select" data-field="' + key + '">' + choices.map(v => '<option ' + (v === value ? 'selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>';
  const heading = (title, subtitle, actions = '') => '<div class="tk-heading"><div><h1>' + esc(title) + '</h1><p class="tk-sub">' + subtitle + '</p></div><div class="tk-actions">' + actions + '</div></div>';
  const ruleSummary = r => '消耗 > ' + r.cost + ' 且 ROAS < ' + r.roas;
  const emptyRow = () => ({id:'row-' + (++seq),time:'',title:'',provider:'',url:'',dramaId:'',attribution:'',order:false});
  let seq = Date.now();
  function makeTenant(id, name) {
    const strategies = [
      {id:id+'s1',name:'测新标准结构',version:1,groups:2,ads:5,budget:100,bid:1.10},
      {id:id+'s2',name:'稳投回收结构',version:1,groups:1,ads:4,budget:60,bid:1.35}
    ];
    const rules = [
      {id:id+'r1',name:'起量账户控损',version:1,cost:30,roas:.7,action:'暂停系列',frequency:'每 30 分钟',mode:'自动执行',owner:id+'o1'},
      {id:id+'r2',name:'回收账户控损',version:1,cost:15,roas:.9,action:'暂停系列',frequency:'每 30 分钟',mode:'自动执行',owner:id+'o2'}
    ];
    const optimizers = [
      {id:id+'o1',name:'起量优化师',dailySpend:500,roas:1.10,priority:'balanced',bc:'示例 BC-' + id.toUpperCase(),accounts:['账户 01','账户 02'],strategyId:strategies[0].id,ruleIds:[rules[0].id],reviewMode:'auto',active:true,buildAt:'10:00',reviewAt:'13:00',maxBudget:150,maxChange:10,version:1,plans:[],builds:[],proposals:[]},
      {id:id+'o2',name:'回收优化师',dailySpend:180,roas:1.35,priority:'roas',bc:'示例 BC-' + id.toUpperCase(),accounts:['账户 03'],strategyId:strategies[1].id,ruleIds:[rules[1].id],reviewMode:'manual',active:true,buildAt:'10:00',reviewAt:'13:00',maxBudget:80,maxChange:10,version:1,plans:[],builds:[],proposals:[]}
    ];
    strategies.push({id:id+'s3',name:'版权方 B 标准结构',version:1,groups:1,ads:5,budget:80,bid:1.20});
    optimizers.forEach((o,index) => {
      const originalId=o.strategyId;
      o.schemes=index===0?[
        {id:id+'scheme1',name:'版权方 A · 首轮',strategyId:strategies[0].id,publisher:'示例版权方 A',round:1,delayMinutes:0,enabled:true,version:1},
        {id:id+'scheme2',name:'版权方 B · 首轮',strategyId:id+'s3',publisher:'示例版权方 B',round:1,delayMinutes:0,enabled:true,version:1}
      ]:[{id:id+'scheme3',name:'稳投 · 标准轮',strategyId:originalId,publisher:'全部',round:1,delayMinutes:0,enabled:true,version:1}];
      o.experiments=[];delete o.strategyId;
      o.plans = [
        {...emptyRow(),date:'2026-11-12',time:'10:00',title:'月光照进旧时光',provider:'示例版权方 A',confirmed:true,status:'已排期'},
        {...emptyRow(),date:'2026-11-12',time:'10:00',title:'他的第二封来信',provider:'示例版权方 B',order:true,confirmed:true,status:'待素材订单'},
        {...emptyRow(),date:'2026-11-12',time:'16:00',title:'逆风的答案',provider:'示例版权方 A',confirmed:true,status:'已排期'}
      ];
    });
    return {id,name,strategies,rules,optimizers,library:{'月光照进旧时光':10,'逆风的答案':8}};
  }
  const initial = [makeTenant('a','演示租户 A'),makeTenant('b','演示租户 B')];
  initial[1].optimizers = initial[1].optimizers.slice(0,1);
  initial.forEach(t => t.optimizers.forEach(o => { o.schemes = o.schemes.slice(0,1); o.experiments = []; }));
  const state = {area:'ai',moduleScope:'bound',highlightId:null,highlightScheme:null,picker:null,schemeEdit:null,abEdit:null,revision:0,tenants:initial,tenant:'a',selected:'ao1',view:'optimizers',tab:'goals',date:'2026-11-12',draft:null,edit:null,returnContext:null,grid:null,gridKey:'',history:[],notice:'',error:false,executionRecord:null,proposalId:null};
  const tenant = () => state.tenants.find(t => t.id === state.tenant) || state.tenants[0];
  const optimizer = () => tenant().optimizers.find(o => o.id === state.selected) || tenant().optimizers[0];
  const rules = o => tenant().rules.filter(r => o.ruleIds.includes(r.id));
  const pending = o => o.proposals.filter(p => p.status === 'pending');
  function restore(snapshot) {
    const p = snapshot && snapshot.privateContent;
    if (!p || p.schema !== 3 || p.revision <= state.revision) return;
    state.revision = p.revision;
    state.tenants = p.tenants;
    state.area=p.area||'ai';state.moduleScope=p.moduleScope||'bound';state.tenant = p.tenant;
    state.selected = p.selected;
    state.view = ['optimizers','overview','schedule','execution','review','pending','strategies','rules','schemes'].includes(p.view) ? p.view : 'optimizers';
  }
  restore(window.openai && window.openai.widgetState);
  function persist() {
    if (!window.openai || !window.openai.setWidgetState) return;
    const o = optimizer();
    const snapshot = {modelContent:{tenant:tenant().name,optimizer:o.name,view:state.view,optimizationMode:o.reviewMode},privateContent:{schema:4,area:state.area,moduleScope:state.moduleScope,revision:++state.revision,tenant:state.tenant,selected:state.selected,view:state.view,tenants:state.tenants}};
    if (new TextEncoder().encode(JSON.stringify(snapshot)).length < 15500) window.openai.setWidgetState(snapshot).catch(() => {});
  }
  function flash(text, error = false) {state.notice = text;state.error = error;}
  function clearTransient() {state.grid = null;state.gridKey = '';state.history = [];state.edit = null;state.executionRecord = null;state.proposalId = null;state.schemeEdit=null;state.abEdit=null;state.picker=null;state.highlightId=null;state.highlightScheme=null;}
  function go(view) {state.view = view;state.notice = '';state.draft = null;state.returnContext = null;clearTransient();render();persist();}
  function optionList(items, selected) {return items.map(v => '<option value="' + esc(v.id) + '" ' + (v.id === selected ? 'selected' : '') + '>' + esc(v.name) + '</option>').join('');}
  function listPage() {
    return heading('AI 投放工作台','每位优化师可运行一套或多套搭建方案，分别设置目标、账户与规则。',button(icon('plus')+' 创建 AI 优化师','create',true))+
      '<div class="tk-grid">'+tenant().optimizers.map(o=>'<article class="tk-card"><div class="tk-row"><div class="tk-card-title"><div class="tk-avatar">'+icon('bot')+'</div><div><h2>'+esc(o.name)+'</h2><p class="tk-small">'+esc(o.bc)+' · '+o.accounts.length+' 个账户</p></div></div>'+pill(o.active?'运行中':'已暂停',o.active?'good':'')+'</div><div class="tk-goals"><div><span class="tk-small">日消耗目标</span><div class="tk-number">'+money(o.dailySpend)+'</div></div><div><span class="tk-small">ROAS 目标</span><div class="tk-number">'+o.roas.toFixed(2)+'</div></div></div><div class="tk-meta"><div>搭建方案 <strong>'+o.schemes.length+' 套</strong> · 引用投放策略 <strong>'+boundStrategyIds(o).length+' 条</strong></div><div>自动规则 <strong>'+rules(o).length+' 条</strong> · 按分配账户监控</div><div>AI 优化方式 <strong>'+(o.reviewMode==='manual'?'人工确认':'自动优化')+'</strong></div></div><div class="tk-card-foot"><span class="tk-small">'+(pending(o).length?pending(o).length+' 项建议待确认':'每日复盘 '+o.reviewAt)+'</span>'+button('进入优化师 '+icon('arrow-right'),'open',true,'data-id="'+o.id+'"')+'</div></article>').join('')+'</div>';
  }

  function overviewPage(o) {
    return heading(o.name,esc(o.bc)+' · '+o.accounts.join('、'),button('编辑优化师','edit')+button(o.active?'暂停优化师':'恢复优化师','toggle-active'))+
      '<section class="tk-card" style="margin-bottom:16px"><div class="tk-stats" style="margin-bottom:0"><div class="tk-stat"><span class="tk-small">日消耗目标</span><div class="tk-number">'+money(o.dailySpend)+'</div></div><div class="tk-stat"><span class="tk-small">ROAS 目标</span><div class="tk-number">'+o.roas.toFixed(2)+'</div></div><div class="tk-stat"><span class="tk-small">AI 优化方式</span><div style="margin-top:9px">'+pill(o.reviewMode==='manual'?'人工确认':'自动优化',o.reviewMode==='manual'?'wait':'good')+'</div></div></div></section>'+
      '<section class="tk-card"><div class="tk-section-head"><div><h2>搭建方案 '+o.schemes.length+' 套</h2><p class="tk-sub">版权方分批、不同轮次或同剧对照，分别调用现有广告搭建。</p></div>'+button('管理搭建方案','ai-go-schemes')+'</div><div class="tk-table-wrap"><table><thead><tr><th>方案</th><th>版权方</th><th>执行安排</th><th>引用投放策略</th><th>状态</th><th></th></tr></thead><tbody>'+schemeRows(o)+'</tbody></table></div></section>'+
      '<section class="tk-card" style="margin-top:16px"><div class="tk-section-head"><h2>自动规则 '+rules(o).length+' 条</h2>'+button('查看本优化师规则','manage-rules')+'</div><p class="tk-sub">监控 '+esc(o.accounts.join('、'))+' 内符合规则条件的广告。</p></section>';
  }

  function beginConfig(isNew) {
    const o = optimizer();
    state.draft = clone(o);
    if (isNew) Object.assign(state.draft,{id:'new',name:'',active:false,plans:[],builds:[],proposals:[],version:1});
    state.draft.isNew = isNew;if(isNew){state.draft.schemes.forEach(s=>{s.id='scheme-'+(++seq);delete s.experimentId;delete s.arm;delete s.accounts;});state.draft.experiments=[];}
    state.tab = 'goals';state.view = 'config';state.notice = '';state.returnContext = null;clearTransient();render();
  }
  function modePicker(d) {
    return '<div class="tk-mode-grid" role="radiogroup" aria-label="AI 规则优化方式">' +
      [['auto','自动优化','复盘后在授权范围内发布；越界建议转人工确认。'],['manual','人工确认','所有搭建策略、自动规则调整，必须采纳后才生效。']].map(([key,label,desc]) => '<label class="tk-mode ' + (d.reviewMode === key ? 'selected' : '') + '"><input type="radio" name="review-mode" data-review-mode value="' + key + '" ' + (d.reviewMode === key ? 'checked' : '') + '><span><strong>' + label + '</strong><small>' + desc + '</small></span></label>').join('') + '</div>';
  }
  function configPage() {
    const d=state.draft;
    const basic='<section class="tk-card tk-stack"><h2>目标与范围</h2><div class="tk-form-grid">'+field('优化师名称','name',d.name)+choose('目标优先关系','priority',prefs[d.priority],Object.values(prefs))+field('日消耗目标（USD）','dailySpend',d.dailySpend,'number','min="1"')+field('ROAS 目标','roas',d.roas,'number','min=".01" step=".05"')+'<div class="tk-field"><span>投放 BC</span><p>'+esc(d.bc)+'</p></div><div class="tk-field"><span>分配账户</span><div class="tk-checks">'+['账户 01','账户 02','账户 03'].map(a=>'<label><input type="checkbox" data-account="'+a+'" '+(d.accounts.includes(a)?'checked':'')+'>'+a+'</label>').join('')+'</div></div></div><div class="tk-note">普通搭建继承所有分配账户；实验分组仅在此范围内明确设置。</div><div class="tk-checks"><label><input type="radio" checked>人工剧单排期</label><label><input type="radio" disabled>自动选剧 '+pill('暂未开放')+'</label></div></section>';
    const bindings='<div class="tk-stack"><section class="tk-card"><div class="tk-section-head"><div><h2>搭建方案 '+d.schemes.length+' 套</h2><p class="tk-sub">每套方案引用一条现有投放策略，可以配置版权方和轮次。</p></div>'+button('从策略库添加方案','config-picker',false,'data-kind="strategy"')+'</div>'+d.schemes.map(s=>'<div class="tk-binding"><span><strong>'+esc(s.name)+'</strong><small>'+esc(schemeStrategy(s).name)+' · '+s.publisher+' · 第 '+s.round+' 轮</small></span>'+pill('ROAS '+schemeStrategy(s).bid.toFixed(2))+'</div>').join('')+'<div class="tk-actions" style="margin-top:14px">'+button('管理当前绑定投放策略','manage-strategy')+'</div></section><section class="tk-card"><div class="tk-section-head"><h2>自动规则 '+d.ruleIds.length+' 条</h2>'+button('从规则库选择','config-picker',false,'data-kind="rule"')+'</div>'+rules(d).map(r=>'<div class="tk-binding"><span><strong>'+esc(r.name)+'</strong><small>'+esc(ruleSummary(r))+'</small></span>'+pill('v'+r.version)+'</div>').join('')+'<div class="tk-actions" style="margin-top:14px">'+button('管理当前绑定规则','manage-rules')+'</div></section></div>';
    const optimization='<div class="tk-stack"><section class="tk-card"><h2>AI 规则优化方式</h2><div style="margin-top:14px">'+modePicker(d)+'</div><p class="tk-sub">人工确认时，新增方案、对照组及规则调整也必须采纳后生效。</p></section><section class="tk-card"><h2>工作安排与优化边界</h2><div class="tk-form-grid" style="margin-top:14px">'+field('默认搭建时间','buildAt',d.buildAt,'time')+field('每天复盘时间','reviewAt',d.reviewAt,'time')+field('每系列日预算上限（USD）','maxBudget',d.maxBudget,'number','min="1"')+field('单次预算调整上限（%）','maxChange',d.maxChange,'number','min="1" max="100"')+'</div><p class="tk-sub">多方案与实验需同时核验总预算；不因新增 B 组扩大账户授权。</p></section></div>';
    return heading(d.isNew?'创建 AI 优化师':'配置 '+d.name,'选择目标与范围，绑定一套或多套搭建方案。',button('返回优化师','cancel-config'))+
      '<div class="tk-config-steps">'+[['goals','1 目标与账户'],['bindings','2 多方案与规则'],['optimization','3 优化方式']].map(([key,label])=>'<button type="button" class="tk-button cursor-interaction '+(state.tab===key?'primary':'')+'" data-action="config-tab" data-tab="'+key+'">'+label+'</button>').join('')+'</div>'+
      (state.tab==='goals'?basic:state.tab==='bindings'?bindings:optimization)+
      '<div class="tk-footer"><span class="tk-small">配置独立保存，引用的策略与规则仍在 TKADA 原模块可查。</span>'+(state.tab==='optimization'?button(d.isNew?'创建优化师':'保存优化师','save-config',true):button('下一步','next-config',true))+'</div>';
  }

  function openModule(view, schemeId, recordId) {
    const fromModule = ['strategies', 'rules'].includes(state.view);
    if (state.area === 'ai' && !fromModule) {
      state.returnContext = {view:state.view, ...(state.view === 'config' ? {tab:state.tab} : {}), ...(schemeId ? {schemeId} : {})};
    }
    state.moduleScope = state.area === 'ai' ? 'bound' : 'all';
    state.highlightId = recordId || null;
    state.picker = null;
    state.edit = null;
    if (recordId) {
      const kind = view === 'strategies' ? 'strategy' : 'rule';
      const record = (kind === 'strategy' ? tenant().strategies : tenant().rules).find(item => item.id === recordId);
      if (record) state.edit = {...clone(record), kind, isNew:false};
    }
    state.view = view;
    state.notice = '';
    render();
  }

  function returnButton() {
    const ctx = state.returnContext;
    if (!ctx || state.area !== 'ai') return '';
    const o = activeConfig();
    const labels = {config:'配置', overview:'概览', schemes:'搭建方案', schedule:'剧单排期', execution:'执行记录', review:'复盘优化', pending:'待确认'};
    const scheme = (o.schemes || []).find(s => s.id === ctx.schemeId);
    return button('返回 ' + esc(o.name) + ' / ' + (labels[ctx.view] || '工作台') + (scheme ? ' / ' + esc(scheme.name) : ''), 'return-module');
  }

  function moduleBanner(label) {
    return '<div class="tk-note" style="margin-bottom:16px">' + esc(label) + '入口示意 · 正式版本复用现有 TK-ADA 页面与编辑器；此处演示共享配置、绑定关系与返回路径。</div>';
  }

  function strategiesPage() {
    const o = activeConfig(), e = state.edit, ids = boundStrategyIds(o);
    const scoped = state.area === 'ai' && state.moduleScope !== 'all';
    const items = tenant().strategies.filter(s => !scoped || ids.includes(s.id));
    return heading('投放策略', state.area === 'ai' ? esc(o.name) + ' · 搭建方案引用的 TK-ADA 投放策略' : '租户共享策略库 · 既有 TK-ADA 功能入口', returnButton() + button('新建策略', 'new-strategy', true)) + moduleBanner('投放策略') + moduleScopeBar('strategy', o) + selectionPanel('strategy', o) +
      '<section class="tk-card"><div class="tk-table-wrap"><table><thead><tr><th>策略名称</th><th>搭建结构</th><th>日预算 / ROAS</th><th>版本</th><th>本优化师使用方案</th><th>其他使用优化师</th><th></th></tr></thead><tbody>' + items.map(s => {
        const schemes = (o.schemes || []).filter(scheme => scheme.strategyId === s.id);
        const others = tenant().optimizers.filter(owner => owner.id !== o.id && boundStrategyIds(owner).includes(s.id));

  function parseTsv(text) {
    const rows = [];let row = [],value = '',quoted = false;
    const source = text.replace(/\r\n?/g,'\n');
    for (let i=0;i<source.length;i++) {const ch=source[i];if(ch==='"'&&(quoted||!value)){if(quoted&&source[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}
      else if(!quoted&&(ch==='\t'||ch==='\n')){row.push(value);value='';if(ch==='\n'){rows.push(row);row=[];}}else value+=ch;}
    if(quoted) throw new Error('粘贴内容引号未闭合。');
    if(value||row.length||!source.endsWith('\n')){row.push(value);rows.push(row);}return rows;
  }

  function executeSchedule(o) {
    const rows=o.plans.filter(r=>r.date===state.date);
    if(!o.active){flash('优化师已暂停，未触发搭建。',true);return;}
    if(!rows.length){flash('请先保存当天排期。',true);return;}
    let created=0,blocked=0,skipped=0;
    rows.forEach(r=>{
      if(!r.built||!r.assignedSchemes)r.assignedSchemes=clone(relevantSchemes(o,r));
      if(!r.assignedSchemes.length){r.status='无适用方案';blocked++;return;}
      r.assignedSchemes.forEach(sc=>{
        const key=r.id+'|'+sc.id+'|'+sc.version+'|'+sc.round+'|'+(sc.arm||'regular');
        if(o.builds.some(b=>b.occurrenceKey===key)){skipped++;return;}
        if(r.order&&!tenant().library[r.title]){blocked++;return;}
        const count=tenant().library[r.title]||0;
        if(!count){blocked++;return;}
        const s=schemeStrategy(sc);if(!s){blocked++;return;}
        r.materialSnapshots||={};const materialKey=sc.experimentId||sc.id;
        if(!r.materialSnapshots[materialKey])r.materialSnapshots[materialKey]={id:'match-'+(++seq),count};
        const material=r.materialSnapshots[materialKey], accounts=sc.accounts||o.accounts;
        if(!accounts.length||accounts.some(a=>!o.accounts.includes(a))){blocked++;return;}
        o.builds.push({id:'build-'+(++seq),kind:'build',rowId:r.id,occurrenceKey:key,time:state.date.slice(5)+' '+addMinutes(r.time||o.buildAt,sc.delayMinutes),title:r.title,schemeId:sc.id,schemeName:sc.name,schemeVersion:sc.version,round:sc.round,experimentId:sc.experimentId||null,arm:sc.arm||null,strategyId:s.id,strategyName:s.name,strategyVersion:s.version,bid:s.bid,optimizerVersion:o.version,accounts:[...accounts],matched:material.count,materialSnapshotId:material.id,status:'回读完成'});
        created++;
      });
      const count=o.builds.filter(b=>b.rowId===r.id).length;
      r.built=count>0;r.status=count===r.assignedSchemes.length?'全部方案已回读':count?'部分方案待处理':r.order?'等待订单成片':'素材未匹配';
    });
    state.grid=null;state.gridKey='';
    flash('原型演示：'+created+' 个方案/轮次调用广告搭建并回读，'+blocked+' 项等待素材或方案，'+skipped+' 个已执行批次未重复创建。');
  }

  }

  function applyProposal(o,p,actor) {
    if(p.status!=='pending')return;
    if(p.kind==='new_scheme'){
      const source=o.schemes.find(s=>s.id===p.entityId);
      if(!source||source.version!==p.baseVersion){p.status='stale';return;}
      if(source.experimentId){flash('该方案已有实验分组，需重新设计，未重复新增 B 组。',true);return;}
      const t=schemeStrategy(source);
      if(t.budget>o.maxBudget){flash('方案预算超出自动优化授权，未发布。',true);return;}
      if(actor==='auto'&&p.budgetAfter>p.budgetBefore){flash('新增 B 组会提高总日预算，超出当前总量授权，需人工确认。',true);return;}try{const b=establishAb(o,source,p.after,p.days,p.distribution);p.newSchemeId=b.id;p.publishedVersion=1;}
      catch(error){flash(error.message,true);return;}
      o.version++;p.status='accepted';p.actor=actor;return;
    }
    const entity=tenant().rules.find(x=>x.id===p.entityId);
    if(!entity||entity.version!==p.baseVersion){p.status='stale';return;}
    const users=tenant().optimizers.filter(x=>x.ruleIds.includes(entity.id));
    if(users.length>1){flash('该规则被多位优化师共用，请先明确共享影响或另存专用规则。',true);return;}
    entity[p.field]=p.after;entity.version++;o.version++;p.status='accepted';p.actor=actor;p.publishedVersion=entity.version;
  }

  function establishAb(o,source,bidB,days,mode='互斥账户分组') {
    const pool=o.accounts;
    if(!pool.length)throw new Error('请先分配账户。');if(mode==='互斥账户分组'&&pool.length<2)throw new Error('互斥账户分组至少需要两个账户，可改为同账户双方案观察。');
    const original=schemeStrategy(source), expId='exp-'+(++seq);
    const bStrategy={...clone(original),id:'strategy-'+(++seq),name:original.name+' · B 出价 '+Number(bidB).toFixed(2),version:1,bid:Number(bidB)};
    tenant().strategies.push(bStrategy);
    const middle=Math.ceil(pool.length/2),same=mode==='同账户双方案观察';
    Object.assign(source,{experimentId:expId,arm:'A',accounts:same?[...pool]:pool.slice(0,middle),version:source.version+1});
    const bScheme={...clone(source),id:'scheme-'+(++seq),name:source.name+' · B 组',strategyId:bStrategy.id,arm:'B',accounts:same?[...pool]:pool.slice(middle),version:1};
    source.name=source.name.replace(/ · A 组$/,'')+' · A 组';
    o.schemes.push(bScheme);
    o.experiments.push({id:expId,name:'ROAS 出价对照',variable:'ROAS 出价',days:Number(days),schemeIds:[source.id,bScheme.id],design:same?'同账户双方案观察，非随机':'明确账户分组，非随机',hypothesis:'同剧同素材条件下比较不同出价，证据成熟后评价。'});
    return bScheme;
  }

  function handleV3Action(a,el) {
    const o=optimizer();
    if(a==='back-ai'||a==='cancel-config'){state.area='ai';state.moduleScope='bound';state.returnContext=null;state.picker=null;go('optimizers');return true;}
    if(a==='config-picker'){
      const kind=el.dataset.kind;openModule(kind==='strategy'?'strategies':'rules');
      state.picker={kind,schemeId:null,selectedIds:kind==='rule'?[...activeConfig().ruleIds]:[]};return true;
    }
    if(a==='global-nav'){
      state.area=el.dataset.view==='optimizers'?'ai':'tool';state.moduleScope='all';state.picker=null;go(el.dataset.view);return true;
    }
    if(a==='ai-nav'||a==='ai-go-schemes'){
      state.area='ai';state.moduleScope='bound';state.returnContext=null;state.highlightId=null;state.highlightScheme=null;state.picker=null;state.schemeEdit=null;state.abEdit=null;state.draft=null;clearTransient();state.view=a==='ai-go-schemes'?'schemes':el.dataset.view;state.notice='';return true;
    }
    if(a==='manage-strategy'||a==='manage-rules'){openModule(a==='manage-strategy'?'strategies':'rules');return true;}
    if(a==='scheme-strategy'){const sc=o.schemes.find(s=>s.id===el.dataset.schemeId);openModule('strategies',sc.id,sc.strategyId);return true;}
    if(a==='module-scope'){state.moduleScope=el.dataset.scope;state.edit=null;state.picker=null;state.notice='';return true;}
    if(a==='open-picker'){
      const kind=el.dataset.kind,schemeId=el.dataset.schemeId;
      state.picker={kind,schemeId:schemeId||null,selectedIds:kind==='rule'?[...activeConfig().ruleIds]:schemeId?[activeConfig().schemes.find(s=>s.id===schemeId).strategyId]:[]};return true;
    }
    if(a==='cancel-picker'){state.picker=null;return true;}
    if(a==='confirm-picker'){
      const p=state.picker,c=activeConfig();if(!p||!p.selectedIds.length){flash('请选择要绑定的配置。',true);return true;}
      if(p.kind==='rule')c.ruleIds=[...p.selectedIds];
      else if(p.schemeId){const sc=c.schemes.find(s=>s.id===p.schemeId);sc.strategyId=p.selectedIds[0];sc.version++;}
      else {const sc=c.schemes[0], next=tenant().strategies.find(x=>x.id===p.selectedIds[0]);if(sc&&next){sc.strategyId=next.id;sc.version++;}}
      state.edit=null;state.highlightId=p.kind==='strategy'&&p.schemeId?p.selectedIds[0]:null;state.picker=null;flash('已更新当前优化师的绑定；租户库原记录保持不变。');return true;
    }
    if(a==='new-scheme'){state.schemeEdit={id:'new',isNew:true,name:'新搭建方案',strategyId:tenant().strategies[0].id,publisher:'全部',round:1,delayMinutes:0,enabled:true,version:1};state.abEdit=null;return true;}
    if(a==='edit-scheme'){state.view='schemes';state.schemeEdit=clone(o.schemes.find(s=>s.id===el.dataset.id));state.abEdit=null;return true;}
    if(a==='cancel-scheme'){state.schemeEdit=null;return true;}
    if(a==='save-scheme'){
      const s=state.schemeEdit;if(!s.name.trim()||!Number.isInteger(Number(s.round))||s.round<1||s.delayMinutes<0){flash('请填写有效方案名称、轮次与延后时间。',true);return true;}
      if(s.isNew){s.id='scheme-'+(++seq);delete s.isNew;o.schemes.push(s);}else{s.version++;o.schemes[o.schemes.findIndex(x=>x.id===s.id)]=s;}
      state.schemeEdit=null;flash('搭建方案已保存；已冻结的旧批次保持原方案。');return true;
    }
    if(a==='new-ab'){
      const source=o.schemes.find(s=>!s.experimentId);if(!source){flash('当前所有方案已在对照中，先添加常规方案。',true);return true;}
      state.abEdit={sourceId:source.id,bidB:Number((schemeStrategy(source).bid+.2).toFixed(2)),days:3,mode:o.accounts.length<2?'同账户双方案观察':'互斥账户分组'};state.schemeEdit=null;return true;
    }
    if(a==='cancel-ab'){state.abEdit=null;return true;}
    if(a==='save-ab'){
      const e=state.abEdit;if(!(e.bidB>=1)||!(e.days>=1)){flash('请填写有效出价与观察窗口。',true);return true;}
      try{establishAb(o,o.schemes.find(s=>s.id===e.sourceId),e.bidB,e.days,e.mode);state.abEdit=null;flash('A / B 方案已保存，分别引用策略；同剧两组共享执行时素材快照。');}catch(error){flash(error.message,true);}
      return true;
    }
    return false;
  }

  function createReview(o) {
    if(o.proposals.length&&!o.proposals.some(p=>p.status==='stale')){flash('本示例窗口已有复盘结果，请处理待确认或等待下一窗口。');return;}
    const stale=o.proposals.filter(p=>p.status==='stale'),r=rules(o)[0],s=singleStrategy(o);
    if(!r||!s){flash('请先绑定投放策略和自动规则。',true);return;}
    const proposals=[{id:'proposal-'+(++seq),kind:'rule',entityId:r.id,name:r.name,field:'cost',before:r.cost,after:Math.max(5,Math.round(r.cost*.8)),baseVersion:r.version,status:'pending',reason:'示例：低回收系列在阈值附近继续消耗，建议调整控损阈值，后续窗口验证。'},{id:'proposal-'+(++seq),kind:'strategy',entityId:s.id,name:s.name,field:'bid',before:s.bid,after:Number((s.bid+.1).toFixed(2)),baseVersion:s.version,status:'pending',reason:'示例：完整日数据支持调整当前投放策略的 ROAS 出价，保持结构不变，下一窗口验证。'}].filter(p=>!stale.length||stale.some(old=>old.entityId===p.entityId));
    stale.forEach(p=>p.status='superseded');o.proposals.push(...proposals);
    if(o.reviewMode==='auto'){proposals.forEach(p=>applyProposal(o,p,'auto'));flash('示例复盘：授权内更新当前投放策略或自动规则；越界建议待确认。');}else flash('复盘产生投放策略和规则建议；全部等待人工采纳，当前配置未变。');
  }

  root.addEventListener('paste',e=>{
    const el=e.target;if(!el.dataset.cell)return;e.preventDefault();
    const [r,c]=el.dataset.cell.split(':').map(Number);
    try{const incoming=parseTsv(e.clipboardData.getData('text/plain'));if(incoming.length+r>1000||incoming.some(row=>row.length+c>gridColumns.length))throw new Error('粘贴区域超出列数或最多 1000 行。');
      if(incoming.some((_,i)=>state.grid[r+i]&&state.grid[r+i].built))throw new Error('已执行的排期只读；请在空白行填写新的投放计划。');rememberGrid();while(state.grid.length<r+incoming.length)state.grid.push(emptyRow());
      incoming.forEach((row,i)=>row.forEach((value,j)=>{const key=gridColumns[c+j][0];state.grid[r+i][key]=key==='order'?['1','是','true','下单'].includes(value.trim().toLowerCase()):value;}));
      render();focusCell(r,c);
    }catch(error){flash(error.message,true);render();focusCell(r,c);}
  });
  root.addEventListener('keydown',e=>{
    const el=e.target;if(!el.dataset.cell)return;const [r,c]=el.dataset.cell.split(':').map(Number),count=gridColumns.length;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(state.history.length){state.grid=state.history.pop();render();focusCell(r,c);}return;}
    let next=r*count+c;
    if(e.key==='Tab')next+=e.shiftKey?-1:1;else if(e.key==='Enter'||e.key==='ArrowDown')next+=count;else if(e.key==='ArrowUp')next-=count;else return;
    if(next<0||next>=1000*count)return;e.preventDefault();if(next>=state.grid.length*count){rememberGrid();state.grid.push(emptyRow());render();}focusCell(Math.floor(next/count),next%count);
  });

    if(a==='new-strategy')state.edit={id:'new',kind:'strategy',isNew:true,name:'新搭建策略',version:1,groups:1,ads:5,budget:100,bid:1.1};
    if(a==='edit-rule')state.edit={...clone(tenant().rules.find(x=>x.id===el.dataset.id)),kind:'rule'};
    if(a==='new-rule')state.edit={id:'new',kind:'rule',isNew:true,name:'新自动规则',version:1,cost:20,roas:.8,action:'暂停系列',frequency:'每 30 分钟',mode:'自动执行'};
    if(a==='cancel-entity')state.edit=null;
    if(a==='save-entity'){
      const entity=state.edit;
      if(!entity||!entity.name.trim()||(entity.kind==='strategy'&&(!(entity.groups>=1)||!(entity.ads>=1)||!(entity.budget>0)||!(entity.bid>=1)))||(entity.kind==='rule'&&(!(entity.cost>=0)||!(entity.roas>=0)))){flash('请填写有效配置。',true);render();return;}
      const collection=entity.kind==='strategy'?tenant().strategies:tenant().rules,copy=clone(entity);
      delete copy.kind;delete copy.isNew;
      if(entity.isNew){copy.id='entity-'+(++seq);collection.push(copy);}else{copy.version++;collection[collection.findIndex(x=>x.id===copy.id)]=copy;}
      if(entity.isNew&&entity.kind==='strategy'&&state.returnContext&&state.returnContext.schemeId){const sc=activeConfig().schemes.find(s=>s.id===state.returnContext.schemeId);if(sc){sc.strategyId=copy.id;sc.version++;}}else if(entity.isNew&&entity.kind==='strategy'&&state.area==='ai'){activeConfig().schemes.push({id:'scheme-'+(++seq),name:copy.name+' · 新方案',strategyId:copy.id,publisher:'全部',round:1,delayMinutes:0,enabled:true,version:1});}if(entity.isNew&&entity.kind==='rule'&&state.area==='ai')activeConfig().ruleIds.push(copy.id);state.highlightId=copy.id;state.edit=null;flash('已保存到原'+(entity.kind==='strategy'?'投放策略':'自动规则')+'记录；绑定该记录的优化师同步读取。');
    }
    if(a==='grid-undo'&&state.history.length)state.grid=state.history.pop();
    if(a==='grid-clear'){rememberGrid();state.grid=state.grid.filter(r=>r.built).map(clone);while(state.grid.length<10)state.grid.push(emptyRow());}
    if(a==='save-grid'){
      const filled=state.grid.filter(r=>r.title.trim()||r.provider.trim()||r.url.trim()||r.dramaId.trim()||r.time.trim()||r.order);
      for(const r of filled){if(!r.title.trim()){flash('存在已填内容但缺少剧名的行。',true);render();return;}if(r.time&&!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(r.time)){flash('执行时间请填写 HH:mm。',true);render();return;}}
      o.plans=[...o.plans.filter(r=>r.date!==state.date),...filled.map(r=>({...clone(r),date:state.date,confirmed:true,status:r.built?r.status:r.order?'待素材订单':'已排期'}))];
      state.grid=null;state.gridKey='';flash('排期已保存。到点后才调用广告搭建匹配素材，账户继承优化师分配范围。');
    }
    if(a==='execute-schedule')executeSchedule(o);
    if(a==='execution-detail')state.executionRecord=o.builds.find(b=>b.id===el.dataset.id);
    if(a==='close-detail')state.executionRecord=null;
    if(a==='run-review')createReview(o);
    if(a==='accept-proposal'){const p=o.proposals.find(p=>p.id===el.dataset.id);if(p){applyProposal(o,p,'human');if(p.status==='accepted')flash('已采纳并发布这项变更；优化师的确认模式未改变。');}}
    if(a==='reject-proposal'){const p=o.proposals.find(p=>p.id===el.dataset.id);if(p&&p.status==='pending'){p.status='rejected';p.actor='human';flash('已记录不采纳；当前配置和版本保持不变。');}}
    if(a==='daily')state.view='daily';
    if(a==='back-review')state.view='review';
    if(a==='build-tasks')state.view='build-tasks';
    render();persist();
  });
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);render();}});
  render();
})();



</script>
