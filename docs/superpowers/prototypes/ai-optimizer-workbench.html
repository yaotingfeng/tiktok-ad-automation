<div id="tkada-ai-optimizer" aria-label="TK-ADA AI 优化师交互原型"></div>
<style>
#tkada-ai-optimizer{--tk-bg:light-dark(#f6f7f9,#17191d);--tk-panel:light-dark(#fff,#202328);--tk-ink:light-dark(#181b21,#f0f1f3);--tk-muted:light-dark(#626b79,#aab1bd);--tk-line:light-dark(#e5e8ed,#363c46);--tk-soft:light-dark(#f0f2f5,#2b3038);--tk-primary:light-dark(#191d25,#f0f1f3);--tk-onprimary:light-dark(#fff,#181b21);--tk-green:light-dark(#19744b,#8ed8b4);--tk-greenbg:light-dark(#edf8f1,#20372c);--tk-amber:light-dark(#986318,#f1c17a);--tk-amberbg:light-dark(#fff7e9,#3b3020);--tk-blue:light-dark(#365dac,#9ebaff);--tk-bluebg:light-dark(#eff4ff,#25314b);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tk-ink);width:100%;text-align:left}
#tkada-ai-optimizer *{box-sizing:border-box}
#tkada-ai-optimizer h1,#tkada-ai-optimizer h2,#tkada-ai-optimizer h3,#tkada-ai-optimizer p{margin:0}
#tkada-ai-optimizer h1{font-size:22px;line-height:32px;font-weight:600;letter-spacing:-.5px}
#tkada-ai-optimizer h2{font-size:16px;line-height:24px;font-weight:600}
#tkada-ai-optimizer h3{font-size:14px;font-weight:600}
#tkada-ai-optimizer button,#tkada-ai-optimizer input,#tkada-ai-optimizer select,#tkada-ai-optimizer textarea{font:inherit}
#tkada-ai-optimizer button{color:inherit}
#tkada-ai-optimizer button:disabled{opacity:.5;cursor:not-allowed}
#tkada-ai-optimizer [hidden]{display:none!important}
#tkada-ai-optimizer .tk-proto{padding:8px 14px;background:var(--tk-soft);border:1px solid var(--tk-line);border-bottom:0;border-radius:12px 12px 0 0;color:var(--tk-muted);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tkada-ai-optimizer .tk-proto b{font-weight:500;color:var(--tk-ink)}
#tkada-ai-optimizer .tk-app{display:grid;grid-template-columns:156px minmax(0,1fr);background:var(--tk-bg);border:1px solid var(--tk-line);border-radius:0 0 12px 12px;min-height:690px;overflow:hidden}
#tkada-ai-optimizer .tk-side{background:var(--tk-panel);border-right:1px solid var(--tk-line);padding:22px 12px;display:flex;flex-direction:column}
#tkada-ai-optimizer .tk-brand{font-size:18px;font-weight:600;padding:0 12px}
#tkada-ai-optimizer .tk-brand-sub{font-size:11px;color:var(--tk-muted);padding:0 12px;margin-top:1px}
#tkada-ai-optimizer .tk-nav-label{font-size:11px;color:var(--tk-muted);padding:24px 12px 8px}
#tkada-ai-optimizer .tk-nav{display:flex;flex-direction:column;gap:4px}
#tkada-ai-optimizer .tk-nav button{display:flex;align-items:center;gap:9px;border:0;border-radius:6px;padding:10px 11px;background:transparent;text-align:left;font-size:13px}
#tkada-ai-optimizer .tk-nav button.is-active{background:var(--tk-soft);font-weight:600}
#tkada-ai-optimizer .tk-nav button:hover{background:var(--tk-soft)}
#tkada-ai-optimizer .tk-nav svg{width:16px;height:16px;flex-shrink:0}
#tkada-ai-optimizer .tk-side-foot{margin-top:auto;padding:26px 12px 0;font-size:11px;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-workspace{min-width:0}
#tkada-ai-optimizer .tk-topbar{background:var(--tk-panel);border-bottom:1px solid var(--tk-line);padding:11px 22px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#tkada-ai-optimizer .tk-tenant{display:flex;align-items:center;gap:8px}
#tkada-ai-optimizer .tk-tenant select{padding:5px 24px 5px 8px;border:1px solid var(--tk-line);border-radius:6px;color:var(--tk-ink);background:var(--tk-panel);font-size:12px}
#tkada-ai-optimizer .tk-topbar .tk-small{font-size:11px}
#tkada-ai-optimizer .tk-content{padding:24px;min-width:0}
#tkada-ai-optimizer .tk-heading{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-sub{color:var(--tk-muted);font-size:12px;margin-top:5px}
#tkada-ai-optimizer .tk-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-button{border:1px solid var(--tk-line);border-radius:6px;background:var(--tk-panel);padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:12px;min-height:33px}
#tkada-ai-optimizer .tk-button:hover{background:var(--tk-soft)}
#tkada-ai-optimizer .tk-button.primary{background:var(--tk-primary);color:var(--tk-onprimary);border-color:var(--tk-primary)}
#tkada-ai-optimizer .tk-button svg{width:14px;height:14px}
#tkada-ai-optimizer .tk-link{background:transparent;border:0;padding:3px 0;color:var(--tk-blue);font-size:12px;text-align:left}
#tkada-ai-optimizer .tk-card{border:1px solid var(--tk-line);border-radius:9px;background:var(--tk-panel);padding:19px;min-width:0}
#tkada-ai-optimizer .tk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#tkada-ai-optimizer .tk-stack{display:grid;gap:16px}
#tkada-ai-optimizer .tk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-card-title{display:flex;align-items:center;gap:10px}
#tkada-ai-optimizer .tk-avatar{display:grid;place-items:center;width:36px;height:36px;background:var(--tk-soft);border-radius:8px;flex-shrink:0}
#tkada-ai-optimizer .tk-avatar svg{width:19px;height:19px}
#tkada-ai-optimizer .tk-pill{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 7px;font-size:11px;white-space:nowrap;background:var(--tk-soft);color:var(--tk-muted)}
#tkada-ai-optimizer .tk-pill.good{background:var(--tk-greenbg);color:var(--tk-green)}
#tkada-ai-optimizer .tk-pill.wait{background:var(--tk-amberbg);color:var(--tk-amber)}
#tkada-ai-optimizer .tk-pill.info{background:var(--tk-bluebg);color:var(--tk-blue)}
#tkada-ai-optimizer .tk-small{font-size:12px;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-goals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 14px}
#tkada-ai-optimizer .tk-number{font-size:25px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin-top:3px}
#tkada-ai-optimizer .tk-number small{font-size:12px;letter-spacing:0;font-weight:400;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-meta{border-top:1px solid var(--tk-line);padding-top:12px;display:grid;gap:7px;font-size:12px;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-meta strong{color:var(--tk-ink);font-weight:500}
#tkada-ai-optimizer .tk-card-foot{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--tk-line);padding-top:14px;margin-top:15px}
#tkada-ai-optimizer .tk-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-tabs{display:flex;gap:20px;border-bottom:1px solid var(--tk-line);margin:0 0 20px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-tabs button{border:0;border-bottom:2px solid transparent;padding:0 0 10px;background:transparent;color:var(--tk-muted);font-size:12px}
#tkada-ai-optimizer .tk-tabs button.is-active{border-bottom-color:var(--tk-ink);color:var(--tk-ink);font-weight:600}
#tkada-ai-optimizer .tk-field{display:flex;flex-direction:column;gap:6px;min-width:0}
#tkada-ai-optimizer .tk-field>span{font-size:12px;font-weight:500}
#tkada-ai-optimizer .tk-input,#tkada-ai-optimizer .tk-select,#tkada-ai-optimizer textarea{width:100%;background:var(--tk-panel);color:var(--tk-ink);border:1px solid var(--tk-line);border-radius:6px;padding:8px 10px;min-width:0}
#tkada-ai-optimizer textarea{resize:vertical;min-height:90px}
#tkada-ai-optimizer .tk-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#tkada-ai-optimizer .tk-full{grid-column:1/-1}
#tkada-ai-optimizer .tk-checks{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
#tkada-ai-optimizer .tk-checks label{display:flex;align-items:center;gap:6px}
#tkada-ai-optimizer input[type=checkbox]{accent-color:var(--tk-ink);width:14px;height:14px}
#tkada-ai-optimizer .tk-note{font-size:12px;padding:11px 13px;border-radius:6px;background:var(--tk-soft);color:var(--tk-muted)}
#tkada-ai-optimizer .tk-note.good{background:var(--tk-greenbg);color:var(--tk-green)}
#tkada-ai-optimizer .tk-note.wait{background:var(--tk-amberbg);color:var(--tk-amber)}
#tkada-ai-optimizer .tk-table-wrap{overflow-x:auto;max-width:100%}
#tkada-ai-optimizer table{border-collapse:collapse;width:100%;font-size:12px}
#tkada-ai-optimizer th{font-weight:500;text-align:left;color:var(--tk-muted);background:var(--tk-bg);padding:10px;border-bottom:1px solid var(--tk-line);white-space:nowrap}
#tkada-ai-optimizer td{padding:12px 10px;border-bottom:1px solid var(--tk-line);vertical-align:middle}
#tkada-ai-optimizer tr:last-child td{border-bottom:0}
#tkada-ai-optimizer .tk-sheet td{padding:7px}
#tkada-ai-optimizer .tk-sheet input[type=text],#tkada-ai-optimizer .tk-sheet input[type=time]{border:0;background:transparent;color:var(--tk-ink);padding:5px 2px;font:inherit;width:100%;min-width:64px}
#tkada-ai-optimizer .tk-sheet .tk-drama{min-width:120px}
#tkada-ai-optimizer .tk-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;justify-content:space-between;flex-wrap:wrap}
#tkada-ai-optimizer .tk-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-breadcrumb{display:flex;gap:7px;align-items:center;font-size:12px;margin-bottom:13px;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}
#tkada-ai-optimizer .tk-stat{padding-right:18px;border-right:1px solid var(--tk-line)}
#tkada-ai-optimizer .tk-stat:last-child{border:0}
#tkada-ai-optimizer .tk-stat .tk-number{font-size:23px}
#tkada-ai-optimizer .tk-progress{background:var(--tk-soft);height:5px;border-radius:4px;margin-top:8px;overflow:hidden}
#tkada-ai-optimizer .tk-progress span{display:block;height:100%;background:var(--tk-ink);border-radius:4px}
#tkada-ai-optimizer .tk-flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-flow b{font-weight:500;color:var(--tk-green)}
#tkada-ai-optimizer .tk-timeline{margin:0;padding:0;list-style:none}
#tkada-ai-optimizer .tk-timeline li{position:relative;padding:0 0 18px 21px;border-left:1px solid var(--tk-line);margin-left:4px}
#tkada-ai-optimizer .tk-timeline li:before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;background:var(--tk-muted);border-radius:50%}
#tkada-ai-optimizer .tk-timeline li:last-child{padding-bottom:0;border-left-color:transparent}
#tkada-ai-optimizer .tk-timeline time{font-size:11px;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-timeline p{font-size:12px;margin-top:4px}
#tkada-ai-optimizer .tk-review-head{padding-bottom:14px;border-bottom:1px solid var(--tk-line);margin-bottom:14px}
#tkada-ai-optimizer .tk-change{display:grid;grid-template-columns:1fr 28px 1fr;gap:10px;align-items:center;margin:12px 0 16px}
#tkada-ai-optimizer .tk-change>div{padding:12px;background:var(--tk-bg);border-radius:6px;font-size:12px}
#tkada-ai-optimizer .tk-change .tk-after{background:var(--tk-greenbg)}
#tkada-ai-optimizer .tk-change b{display:block;font-size:17px;font-weight:600;margin-top:5px}
#tkada-ai-optimizer .tk-empty{padding:40px 15px;text-align:center;color:var(--tk-muted)}
#tkada-ai-optimizer .tk-notice{margin-bottom:16px;background:var(--tk-greenbg);color:var(--tk-green);padding:10px 12px;border-radius:6px;font-size:12px;display:flex;justify-content:space-between;gap:10px}
#tkada-ai-optimizer .tk-error{background:var(--tk-amberbg);color:var(--tk-amber)}
#tkada-ai-optimizer .tk-config-summary{display:flex;gap:10px;align-items:center;background:var(--tk-bg);padding:12px;border-radius:6px;font-size:12px;margin-top:12px;flex-wrap:wrap}
#tkada-ai-optimizer .tk-config-summary strong{font-size:18px;font-weight:600}
#tkada-ai-optimizer .tk-rule-editor{margin-top:14px;padding-top:16px;border-top:1px solid var(--tk-line)}
#tkada-ai-optimizer .tk-rule-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
#tkada-ai-optimizer .tk-rule-line select,#tkada-ai-optimizer .tk-rule-line input{width:auto;max-width:150px;padding:6px 8px;font-size:12px}
#tkada-ai-optimizer .tk-rule-line input[type=number]{width:95px}
#tkada-ai-optimizer .tk-library-row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--tk-line)}
#tkada-ai-optimizer .tk-library-row:last-child{border-bottom:0}
#tkada-ai-optimizer .tk-video{width:30px;height:40px;background:var(--tk-soft);border:1px solid var(--tk-line);display:grid;place-items:center;border-radius:4px}
#tkada-ai-optimizer .tk-video svg{width:14px;height:14px}
#tkada-ai-optimizer .tk-library-row .tk-libtext{flex:1;min-width:0}
@media(max-width:760px){#tkada-ai-optimizer .tk-app{grid-template-columns:126px minmax(0,1fr)}#tkada-ai-optimizer .tk-content{padding:18px}#tkada-ai-optimizer .tk-grid{grid-template-columns:1fr}#tkada-ai-optimizer .tk-side{padding:18px 8px}#tkada-ai-optimizer .tk-topbar{padding:10px 18px}}
@media(max-width:530px){#tkada-ai-optimizer .tk-app{display:block}#tkada-ai-optimizer .tk-side{border-right:0;border-bottom:1px solid var(--tk-line);padding:12px}#tkada-ai-optimizer .tk-brand{padding:0;font-size:16px}#tkada-ai-optimizer .tk-brand-sub,#tkada-ai-optimizer .tk-nav-label,#tkada-ai-optimizer .tk-side-foot{display:none}#tkada-ai-optimizer .tk-nav{flex-direction:row;margin-top:10px;gap:3px;flex-wrap:wrap}#tkada-ai-optimizer .tk-nav button{padding:8px 9px;font-size:12px}#tkada-ai-optimizer .tk-nav button svg{display:none}#tkada-ai-optimizer .tk-content{padding:16px 12px}#tkada-ai-optimizer .tk-topbar{padding:10px 12px}#tkada-ai-optimizer .tk-card{padding:14px}#tkada-ai-optimizer .tk-form-grid{grid-template-columns:1fr}#tkada-ai-optimizer .tk-stats{gap:10px}#tkada-ai-optimizer .tk-stat{padding-right:8px}#tkada-ai-optimizer .tk-stat .tk-number{font-size:20px}#tkada-ai-optimizer h1{font-size:20px}#tkada-ai-optimizer .tk-tabs{gap:14px}#tkada-ai-optimizer .tk-tabs button{font-size:11px}#tkada-ai-optimizer .tk-change{grid-template-columns:1fr 20px 1fr;gap:6px}}
@media(pointer:coarse){#tkada-ai-optimizer .tk-button,#tkada-ai-optimizer .tk-nav button,#tkada-ai-optimizer .tk-tabs button{min-height:44px}#tkada-ai-optimizer input,#tkada-ai-optimizer select,#tkada-ai-optimizer textarea{font-size:16px}}
</style>
<script>
(()=>{
const root=document.getElementById('tkada-ai-optimizer');
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const button=(text,action,primary=false,extra='')=>'<button type="button" class="tk-button cursor-interaction'+(primary?' primary':'')+'" data-action="'+action+'" '+extra+'>'+text+'</button>';
const pill=(text,type='')=>'<span class="tk-pill '+type+'">'+esc(text)+'</span>';
const prefs={balanced:'平衡消耗与回收',spend:'优先消耗',roas:'优先 ROAS'};
const money=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const mkRules=(cost,low,up)=>[
 {name:'低回收控损',metric:'消耗',op:'大于',value:cost,metric2:'ROAS',op2:'小于',value2:low,action:'暂停系列',freq:'每 30 分钟',enabled:true},
 {name:'达标提升预算',metric:'ROAS',op:'大于',value:up,metric2:'消耗',op2:'大于',value2:50,action:'提高预算',amount:10,cap:150,freq:'每 2 小时',enabled:true},
 {name:'零消耗清退',metric:'创建天数',op:'大于',value:3,metric2:'消耗',op2:'等于',value2:0,action:'暂停系列',freq:'每天 12:00',enabled:true}
];
const mkOptimizer=(id,name,spend,roas,priority,bc)=>({id,name,dailySpend:spend,roas,priority,bc,accounts:['账户 01','账户 02'],active:true,version:1,structure:priority==='roas'?'稳投回收结构':'测新标准结构',groups:priority==='roas'?1:2,ads:5,materials:1,budget:priority==='roas'?60:100,bid:roas,rules:mkRules(priority==='roas'?15:30,priority==='roas'?.9:.7,priority==='roas'?1.5:1.25),buildAt:'10:00',reviewAt:'13:00',autoPublish:true,maxBudget:priority==='roas'?80:150,maxChange:10,rows:[
 {id:id+'-r1',date:'2026-11-12',time:'10:00',drama:'月光照进旧时光',provider:'示例版权方 A',order:false,materials:6,status:'素材就绪',confirmed:true},
 {id:id+'-r2',date:'2026-11-12',time:'10:00',drama:'他的第二封来信',provider:'示例版权方 B',order:true,materials:0,status:'待下单',confirmed:false},
 {id:id+'-r3',date:'2026-11-12',time:'16:00',drama:'逆风的答案',provider:'示例版权方 A',order:false,materials:0,status:'待选素材',confirmed:false}
],builds:[],published:false});
const initialTenants=[
 {id:'a',name:'演示租户 A',optimizers:[mkOptimizer('a1','起量优化师',500,1.10,'balanced','示例 BC-A'),mkOptimizer('a2','回收优化师',180,1.35,'roas','示例 BC-A')]},
 {id:'b',name:'演示租户 B',optimizers:[mkOptimizer('b1','稳投优化师',300,1.20,'roas','示例 BC-B')]}
];
const state={revision:0,tenant:'a',selected:'a1',view:'optimizers',configTab:'goals',tenants:initialTenants,draft:null,ruleEdit:null,materialRow:null,librarySelection:[],notice:'',error:false,detail:false,reviewDetail:false,planDate:'2026-11-12',executionRecord:null};
function applySaved(value){const p=value&&value.privateContent;if(p&&p.revision&&p.revision<=state.revision)return;if(p&&p.schema===1&&Array.isArray(p.tenants)){state.revision=p.revision||0;state.tenants=p.tenants;state.tenant=p.tenant||'a';state.selected=p.selected||'a1';state.view=['optimizers','overview','schedule','execution','review'].includes(p.view)?p.view:'optimizers';}}
applySaved(window.openai&&window.openai.widgetState);
const tenant=()=>state.tenants.find(t=>t.id===state.tenant)||state.tenants[0];
const current=()=>tenant().optimizers.find(o=>o.id===state.selected)||tenant().optimizers[0];
function persist(){const o=current();if(window.openai&&window.openai.setWidgetState){const value={modelContent:{tenant:tenant().name,optimizer:o&&o.name,view:state.view,target:o?{dailySpend:o.dailySpend,roas:o.roas,priority:o.priority}:null},privateContent:{schema:1,revision:++state.revision,tenants:state.tenants,tenant:state.tenant,selected:state.selected,view:state.view}};if(new TextEncoder().encode(JSON.stringify(value)).length<15500)window.openai.setWidgetState(value).catch(()=>{});}}
function notice(text,error=false){state.notice=text;state.error=error;}
function go(view){state.view=view;state.draft=null;state.ruleEdit=null;state.materialRow=null;state.notice='';state.detail=false;render();persist();}
function input(label,key,value,type='text',extra=''){return '<label class="tk-field"><span>'+label+'</span><input class="tk-input" data-field="'+key+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>';}
function select(label,key,value,options,extra=''){return '<label class="tk-field"><span>'+label+'</span><select class="tk-select cursor-interaction" data-field="'+key+'" '+extra+'>'+options.map(v=>'<option '+(v===value?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';}
function heading(title,sub,actions=''){return '<div class="tk-heading"><div><h1>'+esc(title)+'</h1><p class="tk-sub">'+sub+'</p></div><div class="tk-actions">'+actions+'</div></div>';}
function ruleText(r){return r.metric+' '+r.op+' '+r.value+(r.metric2?'，'+r.metric2+' '+r.op2+' '+r.value2:'');}
function ruleRows(rules,editing){return rules.map((r,i)=>'<tr><td><strong>'+esc(r.name)+'</strong><div class="tk-small" style="margin-top:3px">'+esc(ruleText(r))+'</div></td><td>'+esc(r.action)+(r.action==='提高预算'?'<div class="tk-small">+'+esc(r.amount||10)+'%，最高 '+money(r.cap||150)+'</div>':r.action==='调整 ROAS 出价'?'<div class="tk-small">目标 '+Number(r.target||1.1).toFixed(2)+'</div>':'')+'</td><td>'+esc(r.freq)+'<div class="tk-small">'+esc(r.mode||'自动执行')+'</div></td><td>'+(editing?'<button class="tk-link cursor-interaction" data-action="edit-rule" data-index="'+i+'">编辑</button>':pill(r.enabled?'已启用':'已暂停',r.enabled?'good':''))+'</td></tr>').join('');}
function listView(){return heading('AI 优化师','每位优化师独立管理自己的目标、策略、剧单和复盘。',button(icon('plus')+' 创建 AI 优化师','create',true))+

 '<div class="tk-note" style="margin-top:16px">当前租户的优化师分别保存配置；修改一位优化师，不会同步修改其他优化师。</div>';}
function overview(o){const spend=Math.round(o.dailySpend*.72),roas=Number((o.roas-.04).toFixed(2));return heading(o.name,esc(o.bc)+' · '+o.accounts.length+' 个账户 · '+prefs[o.priority],button('编辑目标与规则','edit')+button(o.active?'暂停优化师':'恢复优化师','toggle-active'))+
 '<div class="tk-card" style="margin-bottom:16px"><div class="tk-row"><h2>今日目标进展</h2>'+pill(o.active?'按计划运行':'已暂停',o.active?'good':'')+'</div><div class="tk-stats" style="margin-top:18px;margin-bottom:0"><div class="tk-stat"><span class="tk-small">消耗 / 日目标</span><div class="tk-number">'+money(spend)+' <small>/ '+money(o.dailySpend)+'</small></div><div class="tk-progress"><span style="width:72%"></span></div></div><div class="tk-stat"><span class="tk-small">当前 ROAS / 目标</span><div class="tk-number">'+roas.toFixed(2)+' <small>/ '+o.roas.toFixed(2)+'</small></div><div class="tk-small">盘中数据，复盘使用完整日</div></div><div class="tk-stat"><span class="tk-small">下次工作</span><div class="tk-number">'+o.buildAt+'</div><div class="tk-small">11 月 12 日 · 定时搭建</div></div></div></div>'+
 '<div class="tk-grid"><section class="tk-card"><div class="tk-section-head"><h2>当前投放策略</h2>'+pill('v'+o.version)+'</div><div class="tk-meta" style="border:0;padding:0"><div>选剧方式 <strong>人工排期</strong></div><div>搭建结构 <strong>'+esc(o.structure)+'</strong></div><div>结构 <strong>1 系列 / '+o.groups+' 组 / 每组 '+o.ads+' 条广告</strong></div><div>每系列日预算 <strong>'+money(o.budget)+'</strong> · ROAS 出价 <strong>'+o.bid.toFixed(2)+'</strong></div><div>自动规则 <strong>'+o.rules.length+' 条</strong> · 授权内自动发布</div></div><div style="margin-top:16px">'+button('查看目标与策略','edit')+'</div></section><section class="tk-card"><div class="tk-section-head"><h2>下一步待办</h2>'+pill('2 项','wait')+'</div><ul class="tk-timeline"><li><time>明日剧单</time><p>1 部剧待下单，1 部剧待选择手动素材。</p><button class="tk-link cursor-interaction" data-action="nav" data-view="schedule">处理剧单排期 →</button></li><li><time>完整日复盘</time><p>查看本优化师的目标差距、规则调整与验证结果。</p><button class="tk-link cursor-interaction" data-action="nav" data-view="review">查看复盘优化 →</button></li></ul></section></div>'+
 '<section class="tk-card" style="margin-top:16px"><div class="tk-section-head"><h2>最近过程</h2><button class="tk-link cursor-interaction" data-action="nav" data-view="execution">全部执行记录 →</button></div><div class="tk-flow"><b>排期已确认</b><span>→</span><b>素材已核验</b><span>→</span><b>搭建已回读</b><span>→</span><b>自动规则已纳管</b><span>→</span><span>等待完整日复盘</span></div></section>';}
function startEdit(create=false){const o=current();state.draft=JSON.parse(JSON.stringify(create?mkOptimizer('new','',300,1.2,'balanced',o?o.bc:'示例 BC-A'):o));state.draft.isNew=create;if(create){state.draft.rows=[];state.draft.builds=[];state.draft.active=false;}state.view='config';state.configTab='goals';state.ruleEdit=null;state.notice='';render();}
function ruleEditor(){const r=state.ruleEdit;if(!r)return '';const opts=(values,val)=>values.map(v=>'<option '+(v===val?'selected':'')+'>'+esc(v)+'</option>').join('');return '<div class="tk-rule-editor"><h3>'+((r.index==null)?'新建自动规则':'编辑自动规则')+'</h3><div class="tk-form-grid" style="margin-top:12px">'+input('规则名称','rule:name',r.name)+'</div><div class="tk-small" style="margin:12px 0 7px">全部满足以下条件时</div><div class="tk-rule-line"><select class="tk-select" data-rule="metric">'+opts(['消耗','ROAS','创建天数'],r.metric)+'</select><select class="tk-select" data-rule="op">'+opts(['大于','小于','等于'],r.op)+'</select><input class="tk-input" aria-label="条件值" data-rule="value" type="number" step=".01" value="'+r.value+'"></div><div class="tk-rule-line"><span class="tk-small">并且</span><select class="tk-select" data-rule="metric2">'+opts(['消耗','ROAS','创建天数'],r.metric2)+'</select><select class="tk-select" data-rule="op2">'+opts(['大于','小于','等于'],r.op2)+'</select><input class="tk-input" aria-label="第二条件值" data-rule="value2" type="number" step=".01" value="'+r.value2+'"></div><div class="tk-form-grid" style="margin-top:12px">'+select('执行动作','rule:action',r.action,['暂停系列','启用系列','提高预算','调整 ROAS 出价'])+select('执行频率','rule:freq',r.freq,['每 30 分钟','每 2 小时','每天 12:00'])+select('执行方式','rule:mode',r.mode||'自动执行',['自动执行','确认后执行','仅通知'])+'</div>'+(r.action==='调整 ROAS 出价'?'<div style="margin-top:12px">'+input('调整至 ROAS 出价','rule:target',r.target||1.1,'number','min="1" step=".05"')+'</div>':'')+(r.action==='提高预算'?'<div class="tk-form-grid" style="margin-top:12px">'+input('提高比例（%）','rule:amount',r.amount||10,'number','min="1" max="100"')+input('预算上限（USD）','rule:cap',r.cap||150,'number','min="1"')+'</div>':'')+'<div class="tk-actions" style="margin-top:14px">'+button('保存到本优化师规则','save-rule',true)+button('取消','cancel-rule')+'</div></div>';}
function configView(){const d=state.draft;return heading(d.isNew?'创建 AI 优化师':'配置 '+d.name,'目标、搭建结构和自动规则仅属于这位优化师。',button('返回','cancel-edit'))+

 '<div class="tk-stack"><section class="tk-card"><h2>工作安排</h2><div class="tk-form-grid" style="margin-top:14px">'+input('每天搭建时间','buildAt',d.buildAt,'time')+input('每天复盘时间','reviewAt',d.reviewAt,'time')+'</div><p class="tk-sub">工作时区：Asia/Shanghai；投放效果按各账户当地完整日复盘。</p></section><section class="tk-card"><div class="tk-section-head"><h2>自动优化授权</h2><label class="tk-checks"><input type="checkbox" data-field="autoPublish" '+(d.autoPublish?'checked':'')+'>授权范围内自动发布</label></div><div class="tk-form-grid">'+input('系列日预算最高可调至（USD）','maxBudget',d.maxBudget,'number','min="1"')+input('单次预算调整幅度上限（%）','maxChange',d.maxChange,'number','min="1" max="100"')+'</div><div class="tk-note" style="margin-top:14px">可更新本优化师的搭建结构与现有自动规则。越出账户/参数授权或缺少工具能力时，转人工处理；不会修改其他优化师。</div></section></div>')+

 if(a==='review-evidence')state.reviewDetail=!state.reviewDetail;
 if(a==='approve-review')o.autoPublish=true;if(a==='run-review'||a==='approve-review'){if(!o.published&&o.autoPublish){o.rules[0].value=Math.max(5,Math.round(o.rules[0].value*.8));o.version++;o.published=true;notice('示例复盘已完成，授权内发布 v'+o.version+'；仅更新 '+o.name+'，其他优化师未变。');}else{if(!o.published)o.reviewPending=true;notice(o.published?'本轮已复盘并发布，无需重复发布；等待下一观察窗口。':'复盘建议已生成，当前未开启自动发布，待人工确认。');}if(a==='approve-review')o.autoPublish=false;}
