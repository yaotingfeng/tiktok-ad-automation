ex:1;padding:0 24px;border-right:1px solid var(--line)}.summary>div:last-child{border:0}.summary .label{font-size:12px;color:var(--muted);margin-bottom:10px}.summary strong{font-size:24px;letter-spacing:-.6px;font-weight:650}.summary strong small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}.tabs{display:flex;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:0 20px}.tabs button{border:0;border-radius:0;background:none;color:var(--muted);font-weight:450;font-size:13px;min-height:50px;padding:0 2px}.tabs button.active{border-bottom:2px solid var(--primary);color:var(--primary);font-weight:600}.toolbar{padding:14px 20px;display:flex;gap:10px;align-items:center;justify-content:space-between}.toolbar input{max-width:280px;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th{font-weight:500;color:#7b8595;background:#fafbfd;font-size:12px;padding:12px 19px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}td{padding:15px 19px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.5}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfdff}.celltitle{font-weight:550}.cellsub{display:block;margin-top:4px;font-size:11px;color:#8690a0}.num{text-align:right;font-variant-numeric:tabular-nums}.pagination{padding:13px 19px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.footer{position:fixed;bottom:0;left:216px;right:0;background:#fffffffa;border-top:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:3;box-shadow:0 -6px 20px #1e2a4010}.footer strong{font-size:14px}.footer .primary{min-height:41px;padding:10px 18px}.sheet{position:fixed;inset:0;background:#17223555;z-index:8;display:flex;justify-content:flex-end}.sheetpanel{background:#fff;width:min(750px,100%);heigh 20px}.spinner{border:3px solid #e6edfc;border-top-color:var(--primary);border-radius:50%;width:30px;height:30px;animation:spin .8s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:1150px){aside{width:184px}.footer{left:184px}main{padding:24px 22px 120px}.formlayout{grid-template-columns:1fr}.summary>div{padding:0 15px}}@media(max-width:900px){aside{width:64px;padding:24px 8px}.brand{padding:0 7px}.brand .brandtext,.navlabel,.nav .navtext,.sideprofile .profiletext{display:none}.nav button{justify-content:center;padding:11px 0}.sideprofile{padding:12px 7px}.footer{left:64px;padding:12px 20px}.topbar{padding:0 20px}.grid3{gap:10px}}@media(max-width:650px){.demo{flex-wrap:wrap;gap:6px;padding:8px 12px}.demo .grow{display:none}aside{display:none}.topbar{height:auto;min-height:58px;padding:12px 16px}.topbar .context{flex-wrap:wrap;gap:7px}.topbar .role{display:none}main{padding:22px 16px 155px}.footer{left:0;flex-wrap:wrap;gap:10px}.grid2,.grid3{grid-template-columns:1fr}.steps{gap:16px}.step{font-size:11px;gap:5px}.summary{flex-wrap:wrap;row-gap:22px}.summary>div{min-width:50%;border:0}.pagehead{flex-wrap:wrap}.toolbar{flex-wrap:wrap}.tabs{gap:16px;padding:0 14px}.footer .flex{flex-wrap:wrap}.toast{left:50%;transform:translateX(-50%)}h1{font-size:22px}}

<body>
<div class="demo"><strong>交互原型 · 示例数据</strong><span>可操作核心流程，所有提交均为模拟</span><span class="grow"></span><label for="scenario" style="margin:0;font-size:12px">演示场景</label><select id="scenario"><option value="normal">全部可用</option><option value="partial">币种不符 · 部分提交</option><option value="failure">SP2 失败 · 续建</option><option value="unknown">创建结果待核实</option></select><button id="reset">重置演示</button></div>
<div class="app"><aside><div class="brand"><div class="brandmark">↗</div><div class="brandtext"><strong>短剧投放</strong><div class="muted small">TikTok 工作台</div></div></div><div><div class="navlabel">投放工作</div><nav class="nav" id="worknav"></nav></div><div><div class="navlabel">租户管理</div><nav class="nav" id="adminnav"></nav></div><div class="sidebottom"><nav class="nav"><button data-page="platform"><span>▦</span><span class="navtext">平台管理</span></button></nav><div class="sideprofile"><div class="avatar">YT</div><div class="profiletext"><div style="font-size:12px">演示管理员</div><div class="small muted">平台管理员</div></div></div></div></aside><section class="workspace"><header class="topbar"><div class="context"><span class="muted">工作空间</span><strong>示例短剧团队</strong><span class="divider"></span><span><i class="dot"></i>Demo BC</span></div><span class="role">平台管理员 · 当前代管租户</span></header><main id="main"></main></section></div>
<div id="bottom"></div><div id="overlay"></div><div id="notice" aria-live="polite"></div>
<script>
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = (s, type='') => '<span class="badge '+type+'">'+s+'</span>';
const ico = (name) => {const paths={build:'M12 3v18M3 12h18',tasks:'M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1',materials:'M3 5h18v14H3zM9 8l7 4-7 4z',strategies:'M4 7h16M4 17h16M8 4v6M16 14v6',accounts:'M3 4h18v13H3zM8 21h8M12 17v4',providers:'M9 15l6-6M7 13l-2 2a3 3 0 004 4l3-3M12 8l3-3a3 3 0 014 4l-2 2',members:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 3a4 4 0 110 8 4 4 0 010-8M17 4a4 4 0 010 7M22 21v-2a4 4 0 00-3-4'};return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[name]+'" stroke-linecap="round" stroke-linejoin="round"/></svg>';};
const menu=[['build','广告搭建'],['tasks','搭建任务'],['materials','素材库'],['strategies','投放策略'],['accounts','账户与授权'],['providers','版权方连接'],['members','成员管理']];
$('#worknav').innerHTML=menu.slice(0,4).map(([k,n])=>'<button data-page="'+k+'">'+ico(k)+'<span class="navtext">'+n+'</span></button>').join('');
$('#adminnav').innerHTML=menu.slice(4).map(([k,n])=>'<button data-page="'+k+'">'+ico(k)+'<span class="navtext">'+n+'</span></button>').join('');
let page='build',stage=1,tab='dramas',scenario='normal',revision=1,previewRevision=0,submitted=null,filter='',sheetDraft=[],sheetDrama='',lastFocus=null;
let dramaText='The Bond\nHidden Promise',accountText='账户 A\n账户 B\n账户 C',provider='网眼 · 主连接',strategy={name:'英语短剧 · 常规铺量',budget:100,size:3,count:2,roas:1.2,currency:'USD'},uploadFiles=[];
const dramaNames=['The Bond','Hidden Promise'];
const materials=dramaNames.flatMap((title,di)=>Array.from({length:6},(_,i)=>({id:di*6+i+1,title,name:title+'_'+String(i+1).padStart(2,'0')+'.mp4',source:i%2?'账户 B':'账户 A',size:(18+i*2)+'.4 MB'})));
let picked=Object.fromEntries(dramaNames.map(t=>[t,materials.filter(m=>m.title===t).map(m=>m.id)]));
const lines = s => s.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
const unique = a => [...new Set(a)];
const rawLines=s=>s.split(/\r?\n/).map((v,i)=>({v:v.trim(),i:i+1})).filter(x=>x.v);
const resolveDrama=t=>dramaNames.find(d=>d.toLowerCase()===t.toLowerCase());
const dramas = () => unique(lines(dramaText).map(resolveDrama).filter(Boolean));
const accounts = () => unique(lines(accountText)).filter(t=>['账户 A','账户 B','账户 C','DEMO-A','DEMO-B','DEMO-C'].includes(t)).map(t=>t.startsWith('DEMO-')?'账户 '+t.slice(-1):t).filter((v,i,a)=>a.indexOf(v)===i);
const issues = () => [...rawLines(dramaText).map(({v,i})=>({v,i,kind:'剧目',ok:!!resolveDrama(v)})),...rawLines(accountText).map(({v,i})=>({v,i,kind:'账户',ok:['账户 A','账户 B','账户 C','DEMO-A','DEMO-B','DEMO-C'].includes(v)}))].filter(x=>!x.ok);
const groups = t => Math.ceil(picked[t].length/strategy.size);
const isBlocked=(d,a)=>!picked[d].length||(scenario==='partial'&&a==='账户 C');
const units=()=>dramas().flatMap(d=>accounts().map(a=>({d,a,blocked:isBlocked(d,a)})));
const stats=()=>{const all=units(),valid=all.filter(x=>!x.blocked);return{all:all.length,c:valid.length,g:valid.reduce((n,x)=>n+groups(x.d),0),a:valid.reduce((n,x)=>n+groups(x.d)*strategy.count,0),excluded:all.length-valid.length,budget:valid.length*strategy.budget};};
const copies=['One unexpected meeting changes everything. Discover the full story today.','Some secrets are impossible to keep. See what happens next.','A promise that changes their lives. Follow the story from the beginning.','Every choice leads to a new twist. Watch the story unfold.'];
const copy=(g,i)=>copies[(g+i)%copies.length];
function toast(s){$('#notice').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('#notice').innerHTML='',3200);}
function head(title,description,actions=''){return '<div class="pagehead"><div><h1>'+title+'</h1><p>'+description+'</p></div><div class="flex">'+actions+'</div></div>';}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(t=>'<th>'+t+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
function pager(n){return '<div class="pagination"><span>共 '+n+' 条 · 示例数据</span><div class="flex"><span>第 1 页</span><button disabled aria-label="上一页">‹</button><button disabled aria-label="下一页">›</button></div></div>';}
function empty(title,desc){return '<div class="empty"><strong>'+title+'</strong>'+desc+'</div>';}
function footer(left,right){$('#bottom').innerHTML='<div class="footer"><div>'+left+'</div><div class="flex">'+right+'</div></div>';}
function steps(){return '<div class="steps">'+['批量输入','准备与调整','搭建预览'].map((s,i)=>'<div class="step '+(stage===i+1?'active':stage>i+1?'done':'')+'"><b>'+(stage>i+1?'✓':i+1)+'</b>'+s+'</div>').join('')+'</div>';}
function totals(){const s=stats();return '<div class="summary"><div><div class="label">剧目 / 目标账户</div><strong>'+dramas().length+' <small>部 /</small> '+accounts().length+' <small>个</small></strong></div><div><div class="label">本次 Campaign</div><strong>'+s.c+'</strong></div><div><div class="label">Ad Group / Ad</div><strong>'+s.g+' <small>/</small> '+s.a+'</strong></div><div><div class="label">配置日预算合计</div><strong><small>'+strategy.currency+'</small> '+s.budget.toLocaleString()+'</strong></div></div>';}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='strategy-edit'&&b.dataset.page==='strategies')||(page==='task-detail'&&b.dataset.page==='tasks')));$('#bottom').innerHTML='';$('.topbar').innerHTML=page==='platform'?'<div class="context"><strong>平台管理</strong><span class="divider"></span><span class="muted">选择租户进入工作台</span></div><span class="role">平台管理员</span>':'<div class="context"><span class="muted">工作空间</span><strong>示例短剧团队</strong><span class="divider"></span><span><i class="dot"></i>Demo BC</span></div><span class="role">平台管理员 · 当前代管租户</span>';const pages={build:renderBuild,materials:renderMaterials,strategies:renderStrategies,'strategy-edit':renderStrategy,tasks:renderTasks,'task-detail':renderTask,accounts:renderAccounts,providers:renderProviders,members:renderMembers,platform:renderPlatform};(pages[page]||renderBuild)();}
function renderBuild(){const s=stats();let out=head(stage===3?'搭建预览':'广告搭建','批量输入剧目和账户，自动准备推广链接与素材。',badge(stage===1?'草稿 · 示例':'草稿 v'+revision,'info'))+steps();
if(stage===3&&previewRevision!==revision){$('#main').innerHTML=out+'<div class="card pad"><h2>当前预览已过期</h2><p class="hint">草稿或策略已更新。原预览 v'+previewRevision+' 不再代表当前配置，重新生成后可查看新的数量、素材和预算。</p></div>';footer('<strong>请重新生成预览</strong>','<button data-action="back-prepare">返回调整</button><button class="primary" data-action="preview">重新生成预览 →</button>');return;}

function unitTable(rows){return table(['剧目 / 账户','素材准备','Campaign 日预算','结果 / 原因'],rows.map(x=>'<tr><td><span class="celltitle">'+x.d+'</span><span class="cellsub">'+x.a+' · DEMO-'+x.a.slice(-1)+'</span></td><td>'+badge(!picked[x.d].length?'素材为空':x.a==='账户 A'?'目标素材已可用':'提交后分发',!picked[x.d].length?'error':x.a==='账户 A'?'ok':'info')+'</td><td>'+strategy.currency+' '+strategy.budget+'</td><td>'+badge(x.blocked?(!picked[x.d].length?'无可用素材':'账户币种 EUR 与 USD 不符'):'可提交',x.blocked?'warn':'ok')+'</td></tr>'));}

function materialSheet(t){sheetDrama=t;sheetDraft=[...picked[t]];const body='<div class="alert mb">本次调整用于「'+t+'」的全部 '+accounts().length+' 个目标账户，不修改素材库归属。</div><div class="flex between mb"><h3>已用素材</h3><span id="selected-count" class="small muted">'+sheetDraft.length+' 份 · 每组 '+strategy.size+' 份</span></div>'+materials.filter(m=>m.title===t).map(m=>'<label class="materialrow" style="font-weight:400;margin:0"><input type="checkbox" data-pick="'+m.id+'" '+(sheetDraft.includes(m.id)?'checked':'')+'><div class="thumb '+(m.title==='Hidden Promise'?'rose':'')+'">▶</div><div class="grow"><div>'+esc(m.name)+'</div><div class="small muted">'+m.size+' · 实际源账户：'+m.source+'</div></div>'+badge('已上传','ok')+'</label>').join('')+'<div class="hint mt">默认按文件名排序，保留不足 '+strategy.size+' 份的尾组。本原型演示增减；组间移动与全库分页搜索见页面设计。</div>';openSheet('调整素材 · '+t,'文件名包含完整剧名时自动匹配。',body,'<span class="small muted">只影响当前草稿</span><div class="flex"><button data-action="close-sheet">取消</button><button class="primary" data-action="save-materials">保存调整</button></div>');}

function renderTasks(){$('#main').innerHTML=head('搭建任务','查看创建进度、实际结果及需要处理的异常。','<button data-page="build" class="primary">＋ 广告搭建</button>')+'<div class="card">'+(submitted?table(['批次','剧目 / 账户','Ad 成功 / 提交','任务状态','操作'],['<tr><td><span class="celltitle">DEMO-0908-01</span><span class="cellsub">示例短剧团队 · Demo BC</span></td><td>'+submitted.dramaCount+' / '+submitted.accountCount+'</td><td>'+(submitted.a-submitted.failed-submitted.unknown)+' / '+submitted.a+'</td><td>'+taskBadge()+'</td><td><button class="link" data-page="task-detail">查看详情 →</button></td></tr>']):empty('暂无搭建任务','完成预览并模拟提交后，可在这里查看结果。'))+'</div>';}
function taskBadge(){return badge(submitted.unknown?'待核实':submitted.failed?'部分完成':'创建完成',submitted.unknown?'warn':submitted.failed?'error':'ok');}
function renderTask(){if(!submitted){page='tasks';return renderTasks();}const s=submitted;$('#main').innerHTML=head('DEMO-0908-01',s.dramaCount+' 部剧 · '+s.accountCount+' 个目标账户 · '+s.strategyName+' · 示例执行结果','<button data-page="tasks">返回任务列表</button>'+taskBadge())+'<div class="alert '+(s.failed||s.unknown?'warn':'')+' mb">'+(s.unknown?'1 条 Ad 创建结果待核实，先回查实际结果，再决定是否续建。':s.failed?'1 条 SP'+s.failedCreative+' 创建失败，成功广告保留；可使用原参数只重试缺失步骤。':'本批创建结果已核查，广告已启用。审核中不等于已开始投放或产生消耗。')+'</div><div class="card mb"><div class="cardhead flex between"><h2>广告创建结果</h2><span class="small muted">原冻结预览 v'+s.revision+' · 示例模拟</span></div>'+table(['对象','计划','提交','成功','失败','待核实','待执行','排除'],['<tr><td>Campaign</td><td>'+(s.c+s.excluded)+'</td><td>'+s.c+'</td><td>'+s.c+'</td><td>0</td><td>0</td><td>0</td><td>'+s.excluded+'</td></tr>','<tr><td>Ad Group</td><td>'+(s.g+s.excludedGroups)+'</td><td>'+s.g+'</td><td>'+s.g+'</td><td>0</td><td>0</td><td>0</td><td>'+s.excludedGroups+'</td></tr>','<tr><td>Ad</td><td>'+(s.a+s.excludedAds)+'</td><td>'+s.a+'</td><td>'+(s.a-s.failed-s.unknown)+'</td><td>'+s.failed+'</td><td>'+s.unknown+'</td><td>0</td><td>'+s.excludedAds+'</td></tr>'])+'</div><div class="card"><div class="cardhead flex between"><h2>'+(s.failed||s.unknown?'异常与待核实':'核查记录')+'</h2>'+(s.unknown?'<button data-action="reconcile">回查未知结果</button>':s.failed?'<button data-action="retry">仅重试失败步骤</button>':badge('全部完成','ok'))+'</div>'+table(['对象定位','结果','处理说明'],['<tr><td>'+esc(s.firstDrama)+' · '+esc(s.firstAccount)+'<span class="cellsub">素材组 1 / SP'+s.failedCreative+'</span></td><td>'+badge(s.unknown?'创建结果未知':s.failed?'确定失败':'已创建 · ENABLE',s.unknown?'warn':s.failed?'error':'ok')+'</td><td>'+(s.unknown?'超时后尚未确认是否已创建；先回查':s.failed?'保留已成功对象，仅续建 SP'+s.failedCreative:'远端 ID 已记录；审核状态：审核中')+'</td></tr>'])+'</div><div class="grid2 mt"><div class="card pad"><h3>素材准备</h3><div class="hint">所有提交单元的素材已就绪</div><div class="progress mt"><span></span></div></div><div class="card pad"><h3>配置日预算合计 '+s.currency+' '+s.budget+'</h3><div class="hint">各已提交 Campaign 日预算之和，非实际消耗；不包含排除项。</div></div></div>';}
function renderAccounts(){$('#main').innerHTML=head('账户与授权','当前 BC 的全部授权账户。上传使用的账户由系统自动指定。')+'<div class="card"><div class="tabs"><button data-tab="accounts" class="'+(tab!=='connections'?'active':'')+'">广告账户</button><button data-tab="connections" class="'+(tab==='connections'?'active':'')+'">授权连接</button></div>'+(tab==='connections'?table(['连接','BC','授权状态','信息'],['<tr><td>TikTok · 示例授权</td><td>Demo BC</td><td>'+badge('已授权','ok')+'</td><td class="muted">此原型仅展示连接布局</td></tr>']):'<div class="toolbar"><span class="small muted">生产版本支持服务端搜索、过滤与分页</span>'+badge('当前展示 3 个示例账户')+'</div>'+table(['账户名称 / ID','币种','授权状态','归属'],['A','B','C'].map(x=>'<tr><td>账户 '+x+'<span class="cellsub mono">DEMO-'+x+'</span></td><td>'+(scenario==='partial'&&x==='C'?'EUR':'USD')+'</td><td>'+badge('可用','ok')+'</td><td>示例短剧团队</td></tr>'))+pager(3))+'</div>';}
function renderProviders(){$('#main').innerHTML=head('版权方连接','每个租户独立配置版权方连接，搭建时按当前连接解析剧目。')+'<div class="grid2">'+['网眼','嘉书'].map(n=>'<div class="card pad"><div class="flex between mb"><h2>'+n+' · 主连接</h2>'+badge('可用','ok')+'</div><div class="kv"><span class="muted">所属租户</span><span>示例短剧团队</span></div><div class="kv"><span class="muted">应用</span><span>Demo Minis · 英语</span></div><div class="kv"><span class="muted">凭据</span><span>已配置 · 不回显</span></div><div class="hint mt">同一推广配置优先复用链接，配置冲突回到输入行处理。</div></div>').join('')+'<div class="alert mt">连接编辑、测试与链接记录的完整状态见功能设计；本页用于布局评审。</div>';}
function renderMembers(){$('#main').innerHTML=head('成员管理','租户内按角色授予操作权限，不按投手划分广告账户。')+'<div class="card">'+table(['成员','角色','状态','权限说明'],[['示例管理员','tenant_admin','管理连接、成员和投放'],['示例运营','operator','素材、策略和广告搭建'],['示例观察者','viewer','只读查看']].map(([n,r,d])=>'<tr><td>'+n+'</td><td>'+r+'</td><td>'+badge('启用','ok')+'</td><td class="muted">'+d+'</td></tr>'))+'</div><p class="hint mt">成员添加和停用交互见功能设计，本原型展示页面结构。</p>';}
function renderPlatform(){$('#main').innerHTML=head('平台租户管理','进入租户后复用同一套工作台，所有操作仍在该租户范围内。')+'<div class="card">'+table(['租户','状态','BC / 账户','操作'],['<tr><td><span class="celltitle">示例短剧团队</span><span class="cellsub">演示租户</span></td><td>'+badge('正常','ok')+'</td><td>1 / 3</td><td><button class="link" data-page="build">进入租户 →</button></td></tr>'])+'</div>';}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;tab=page==='build'?'dramas':'';filter='';render();return;}const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return;}const mat=e.target.closest('[data-material]');if(mat){materialSheet(mat.dataset.material);return;}const detail=e.target.closest('[data-detail]');if(detail){detailSheet(detail.dataset.detail);return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='save-draft'){dramaText=$('#drama-input').value;accountText=$('#account-input').value;provider=$('#provider').value;toast('草稿已保留在本次演示中');}
if(a==='prepare'){dramaText=$('#drama-input').value;accountText=$('#account-input').value;provider=$('#provider').value;if(!lines(dramaText).length||!lines(accountText).length){toast('请分别粘贴至少一行剧目和账户');return;}revision++;$('#bottom').innerHTML='';$('#main').innerHTML=head('正在准备','草稿已保存，正在解析输入并准备推广链接。')+'<div class="card preparing" role="status"><div class="spinner"></div><h2>正在匹配剧目、账户与素材</h2><p class="hint">这是本地演示，未连接版权方或 TikTok。</p></div>';setTimeout(()=>{stage=2;tab='dramas';render();},600);}
if(a==='preview'){stage=3;previewRevision=revision;tab='dramas';render();}
if(a==='back-input'){stage=1;render();}
if(a==='back-prepare'){stage=2;tab='dramas';render();}
if(a==='close-sheet')closeSheet();
if(a==='save-materials'){picked[sheetDrama]=[...sheetDraft];revision++;closeSheet();render();toast('素材已调整；新的预览将使用本次分组');}
if(a==='edit-strategy'){page='strategy-edit';render();}
if(a==='save-strategy'){const size=Number($('#group-size').value),budget=Number($('#budget').value),roas=Number($('#roas').value),name=$('#strategy-name').value.trim();if(!Number.isInteger(size)||size<1||!Number.isFinite(budget)||budget<=0||!Number.isFinite(roas)||roas<=0||!name){toast('请填写策略名称和有效的正数参数');return;}strategy={...strategy,name,size,budget,roas,count:Number($('#creative-count').value)};revision++;page='strategies';render();toast('示例策略已更新；原预览需重新生成');}
if(a==='upload')openSheet('批量上传素材','文件将由系统推送到租户授权账户；此处仅演示队列。','<div class="alert mb">请在素材文件名中包含完整剧目名称。广告搭建时，系统会根据剧名自动匹配素材。</div><div class="filedrop"><h3 class="mb">选择本地视频文件</h3><label for="files" class="small muted">可一次选择多个文件，原型不会读取视频内容或上传</label><input type="file" id="files" multiple accept="video/*"><div id="file-summary" class="hint"></div></div>','<span class="small muted">系统自动指定目标上传账户</span><button class="primary" data-action="mock-upload">开始上传（演示）</button>');
if(a==='mock-upload'){const files=Array.from($('#files').files);if(!files.length){toast('请先选择本地视频文件');return;}uploadFiles.push(...files.map(f=>({name:f.name,size:f.size})));closeSheet();page='materials';tab='uploads';render();toast('已模拟上传队列；没有传输任何文件');}
if(a==='submit'){const s=stats();if(!s.c||previewRevision!==revision)return;if(submitted&&submitted.revision===previewRevision){page='task-detail';render();return;}const excluded=units().filter(x=>x.blocked);submitted={...s,revision,dramaCount:dramas().length,accountCount:accounts().length,strategyName:strategy.name,currency:strategy.currency,failedCreative:Math.min(2,strategy.count),firstDrama:units().find(x=>!x.blocked).d,firstAccount:units().find(x=>!x.blocked).a,excludedGroups:excluded.reduce((n,x)=>n+groups(x.d),0),excludedAds:excluded.reduce((n,x)=>n+groups(x.d)*strategy.count,0),failed:scenario==='failure'?1:0,unknown:scenario==='unknown'?1:0};page='task-detail';render();toast('模拟任务已生成，未创建真实广告');}
if(a==='retry'){submitted.failed=0;render();toast('示例：只续建失败的 SP'+submitted.failedCreative+'，其他成功对象保持不变');}
if(a==='reconcile'){submitted.unknown=0;render();toast('示例回查：远端已创建，已补记 ID，没有重复创建');}
});
document.addEventListener('input',e=>{if(e.target.id==='drama-input')dramaText=e.target.value;if(e.target.id==='account-input')accountText=e.target.value;if(e.target.matches('[data-pick]')){const id=Number(e.target.dataset.pick);sheetDraft=e.target.checked?unique([...sheetDraft,id]).sort((a,b)=>a-b):sheetDraft.filter(x=>x!==id);$('#selected-count').textContent=sheetDraft.length+' 份 · 每组 '+strategy.size+' 份';}if(e.target.id==='material-search'){filter=e.target.value;const pos=e.target.selectionStart;renderMaterials();$('#material-search').focus();$('#material-search').setSelectionRange(pos,pos);}if(['budget','group-size','creative-count'].includes(e.target.id))structure();if(e.target.id==='files')$('#file-summary').textContent='已选择 '+e.target.files.length+' 个文件';});
document.addEventListener('keydown',e=>{const panel=$('.sheetpanel');if(!panel)return;if(e.key==='Escape'){closeSheet();return;}if(e.key==='Tab'){const els=panel.querySelectorAll('button:not(:disabled),input,select,textarea,[href]');const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.id==='sheet-title')){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('#scenario').addEventListener('change',e=>{scenario=e.target.value;revision++;if(stage===3)previewRevision=revision;submitted=null;render();toast('已切换示例场景；可走完整搭建流程查看结果');});
$('#reset').addEventListener('click',()=>location.reload());
render();
</script></body></html>
