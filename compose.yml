name: tiktok-ad-automation

x-app-environment: &app-environment
  PROJECT_NAME: ${PROJECT_NAME:-TikTok Ad Automation}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Set FIRST_SUPERUSER}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Set FIRST_SUPERUSER_PASSWORD}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/app
  REDIS_URL: redis://redis:6379/0
  FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
  TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
  TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
  TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
  TIKTOK_CALL_POLICIES: ${TIKTOK_CALL_POLICIES:-{}}
  CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}

x-app: &app
  image: ${APP_IMAGE:-tiktok-ad-automation:local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: *app-environment
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - app-db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d app]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  prestart:
    <<: *app
    command: [bash, scripts/prestart.sh]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  backend:
    <<: *app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --workers, '4', --no-access-log]
    depends_on:
      prestart: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/utils/health-check/", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [celery, -A, app.jobs.celery_app:celery_app, worker, -Q, 'resources,builds,control', --loglevel=INFO]
    depends_on:
      prestart: {condition: service_completed_successfully}
  beat:
    <<: *app
    command: [celery, -A, app.jobs.celery_app:celery_app, beat, --schedule, /var/run/celery/celerybeat-schedule, --loglevel=INFO]
    volumes:
      - beat-data:/var/run/celery
    depends_on:
      prestart: {condition: service_completed_successfully}
volumes:
  app-db-data:
  redis-data:
  beat-data:
